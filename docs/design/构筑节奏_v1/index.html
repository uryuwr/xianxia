// 墨色梯度：纸 → 焦墨（单色顺序梯度）
const PAPER = [236, 230, 214], INK = [31, 32, 29];
const ink = (t) => `rgb(${PAPER.map((p, i) => Math.round(p + (INK[i] - p) * Math.pow(t, 0.85))).join(",")})`;
const fg = (t) => (t > 0.48 ? "#f3eee2" : "#15181b");
document.getElementById("rampbar").style.background = `linear-gradient(90deg, ${[0, 0.25, 0.5, 0.75, 1].map(ink).join(",")})`;

function score(list, r) { return list.reduce((s, p) => s + (p[1] >= 0 && p[1] <= r ? W[p[2]] : 0), 0) / list.length; }
function baseOf(k, name) { return BASE[k].find((p) => p[0] === name); }
function changed(k, p) { const b = baseOf(k, p[0]); return b && (b[1] !== p[1] || b[2] !== p[2]); }
function firstAt(list, th) { for (let r = 0; r < REALMS.length; r++) if (score(list, r) >= th - 1e-9) return r; return -1; }
const chip = (k, p, later) => `<span class="chip ${CLS[p[2]]}${later ? " later" : ""}"><span class="c">${p[2]}</span>${p[0]}${changed(k, p) ? '<span class="g"></span>' : ""}</span>`;

let cur = "base", sel = 5;
const $ = (id) => document.getElementById(id);
const tip = $("tip");

function tabs() {
  $("tabs").innerHTML = ORDER.map((k) => `<a data-k="${k}" class="${k === cur ? "on" : ""}">${DIRS[k].tab}</a>`).join("") + `<a data-k="ov" class="${cur === "ov" ? "on" : ""}">并排对比</a>`;
  $("tabs").querySelectorAll("a").forEach((a) => (a.onclick = () => { cur = a.dataset.k; location.hash = cur; render(); }));
}

function matrix() {
  const D = DIRS[cur], U = D.unlock || DIRS.base.unlock;
  let h = `<thead><tr><th class="rl"></th>${REALMS.map((r, i) => `<th class="realm kai${i === sel ? " sel" : ""}" data-r="${i}">${r}</th>`).join("")}</tr>`;
  h += `<tr><th class="rl"><small>开栏 / 事件</small></th>${REALMS.map((_, i) => `<td class="unl${i === sel ? " sel" : ""}" data-r="${i}">${(U[i] || []).map((s) => (s[0] === "+" ? `<i class="chg">${s.slice(1)}</i>` : `<i>${s}</i>`)).join("")}</td>`).join("")}</tr>`;
  h += `<tr><th class="rl"><small>首领</small></th>${REALMS.map((_, i) => `<td class="boss" data-r="${i}">${BOSS[i] ? `<span class="kai">${BOSS[i]}</span>` : ""}</td>`).join("")}</tr></thead><tbody>`;
  for (const B of BUILDS) {
    const list = D.pieces[B.k];
    h += `<tr><th class="rl kai">${B.n}<small>${B.d}</small></th>`;
    for (let r = 0; r < REALMS.length; r++) {
      const t = score(list, r), add = list.filter((p) => p[1] === r);
      h += `<td class="cell${r === sel ? " sel" : ""}" data-b="${B.k}" data-r="${r}" style="background:${ink(t)};color:${fg(t)}">`
        + `<span class="pct">${Math.round(t * 100)}%</span>${add.length ? `<span class="add">+${add.map((p) => p[0]).join(" ")}</span>` : ""}`
        + `${t >= SHOW_OK - 1e-9 ? '<span class="ok">成</span>' : ""}</td>`;
    }
    h += "</tr>";
  }
  $("mx").innerHTML = h + "</tbody>";
  $("mx").querySelectorAll("[data-r]").forEach((el) => {
    el.onclick = () => { sel = +el.dataset.r; render(); };
    if (el.classList.contains("cell")) {
      el.onmousemove = (e) => showTip(e, el.dataset.b, +el.dataset.r);
      el.onmouseleave = () => (tip.style.display = "none");
    }
  });
}

function showTip(e, k, r) {
  const list = DIRS[cur].pieces[k], B = BUILDS.find((b) => b.k === k);
  const add = list.filter((p) => p[1] === r), have = list.filter((p) => p[1] >= 0 && p[1] < r), miss = list.filter((p) => p[1] < 0 || p[1] > r);
  const line = (p) => { const b = baseOf(k, p[0]); return `<div class="row">${chip(k, p)} <span class="n">${p[3]}</span>${changed(k, p) ? `<div class="n" style="color:var(--jin)">现状：${b[1] < 0 ? "拿不到" : REALMS[b[1]] + " · " + b[2]}</div>` : ""}</div>`; };
  tip.innerHTML = `<h5>${B.n} · ${REALMS[r]} · ${Math.round(score(list, r) * 100)}%</h5>`
    + (add.length ? `<div class="n">这一层新到手</div>${add.map(line).join("")}` : `<div class="n">这一层没有新部件</div>`)
    + (have.length ? `<div class="n" style="margin-top:4px">之前已有：${have.map((p) => p[0]).join("、")}</div>` : "")
    + (miss.length ? `<div class="n">还差：${miss.map((p) => p[0] + (p[1] < 0 ? "（拿不到）" : `（${REALMS[p[1]]}）`)).join("、")}</div>` : "");
  tip.style.display = "block";
  const x = Math.min(e.clientX + 16, innerWidth - tip.offsetWidth - 10), y = Math.min(e.clientY + 16, innerHeight - tip.offsetHeight - 10);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}

function side() {
  const D = DIRS[cur];
  let h = `<h3 class="kai">${REALMS[sel]} 时身上<small>${BOSS[sel] ? `正好打${BOSS[sel]}` : "点左侧任一列切换"}</small></h3>`;
  for (const B of BUILDS) {
    const list = D.pieces[B.k];
    h += `<div class="bline"><span class="bn">${B.n}</span><span class="bp">${Math.round(score(list, sel) * 100)}%</span><br>${list.map((p) => chip(B.k, p, p[1] < 0 || p[1] > sel)).join("")}</div>`;
  }
  h += `<div class="sep"></div><div class="pc"><div><h4>得</h4><ul>${D.pro.map((s) => `<li>${s}</li>`).join("")}</ul></div><div><h4>失</h4><ul>${D.con.map((s) => `<li>${s}</li>`).join("")}</ul></div></div>`;
  if (D.files) h += `<div class="files">要改：${D.files}</div>`;
  $("side").innerHTML = h;
}

function compare() {
  const cols = [["青牙时", 5, "pct"], ["碧鳞时", 7, "pct"], ["定向", SHOW_DIR, "at"], ["成型", SHOW_OK, "at"]];
  let h = `<p class="idea"><span class="kai">并排对比</span>同一个流派、同一组核心部件，四种节奏下的成型度（格子颜色同矩阵）。"定向" = 成型度第一次 ≥ 35% 的境界，"成型" = 第一次 ≥ 70%。</p>`;
  h += `<table class="cmp"><thead><tr><th></th>${ORDER.map((k, i) => `${i ? '<th class="gap"></th>' : ""}<th colspan="4">${DIRS[k].tab}</th>`).join("")}</tr>`;
  h += `<tr class="sub"><th></th>${ORDER.map((k, i) => `${i ? '<th class="gap"></th>' : ""}${cols.map((c) => `<th>${c[0]}</th>`).join("")}`).join("")}</tr></thead><tbody>`;
  for (const B of BUILDS) {
    h += `<tr><th class="rl">${B.n}</th>`;
    ORDER.forEach((k, i) => {
      const list = DIRS[k].pieces[B.k];
      if (i) h += '<td class="gap" style="background:none"></td>';
      for (const [, v, kind] of cols) {
        if (kind === "pct") { const t = score(list, v); h += `<td style="background:${ink(t)};color:${fg(t)}">${Math.round(t * 100)}%</td>`; }
        else { const r = firstAt(list, v); h += `<td class="tx${r < 0 ? " never" : ""}">${r < 0 ? "到不了" : `<b>${REALMS[r]}</b>`}</td>`; }
      }
    });
    h += "</tr>";
  }
  h += `</tbody></table><p class="cmp-note">数字是按"必得 1 / 常见 0.6 / 罕见 0.25"粗估的期望，不是掉率模拟；方向二、三里的"二选一 / 三选一"按"走这条路的人选了对应那件"计，所以同一局里四个流派不会同时拿满。</p>`;
  h += `<div class="sep" style="max-width:900px"></div><div class="qs">
    <div><h4>请选 1 · 走哪个方向</h4><ol><li>方向一：只补缺口（改动最小）</li><li>方向二：青牙首杀选本命（选择点放在首领上）</li><li>方向三：练二入门定向 + 掉落偏向（方向感最早）</li><li>二 + 三 组合：入门定向，青牙再选本命</li></ol></div>
    <div><h4>请选 2 · 法术流的真气从哪来</h4><ol><li>紫金葫芦（法宝，吸取回气）</li><li>聚灵阵（阵法，阵内回气）</li><li>两个都给，各占一个栏位</li></ol><p class="cmp-note">都不违反"真气不自动回复、击杀不回复"。</p></div>
    <div><h4>请选 3 · 选错了怎么办</h4><ol><li>静室花悟性改选（推荐）</li><li>不能改，靠后续掉落补</li><li>每个境界大关（筑基）免费重选一次</li></ol></div>
  </div>`;
  $("cmp").innerHTML = h;
}

function render() {
  tabs();
  document.body.classList.toggle("ov", cur === "ov");
  if (cur === "ov") return compare();
  const D = DIRS[cur];
  $("idea").innerHTML = `<span class="kai">${D.title}</span>${D.one}`;
  matrix(); side();
}
const h0 = location.hash.slice(1); if (h0 === "ov" || DIRS[h0]) cur = h0;
render();
</script>
</body></html>
