<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>墨途 · 天机镜 v2 · 方向 B 镜开为册</title>
<link rel="stylesheet" href="../../../../src/ui/ink/strokes.css">
<link rel="stylesheet" href="../../../../src/ui/ink/ink-ui.css">
<link rel="stylesheet" href="base.css">
<script src="../../../../src/ui/ink/ink-ui.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<style>
.veil { background: rgba(225, 218, 200, .55); }

/* ---------- 装裱册页（与灵泉 / 境界册页同一结构） ---------- */
.mount { left: 46px; top: 34px; width: 1188px; height: 652px; background: var(--silk); box-shadow: 0 10px 28px rgba(40, 32, 20, .35), inset 0 0 0 1px rgba(90, 70, 40, .25); }
.leaf { position: absolute; inset: 13px; background: var(--ink-tex-paper), var(--ink-tex-fiber), var(--paper-hi); background-blend-mode: multiply; box-shadow: inset 0 0 0 1px rgba(90, 70, 40, .18); overflow: hidden; }
.fold { position: absolute; left: 404px; top: 22px; bottom: 22px; width: 10px; background: linear-gradient(90deg, transparent, rgba(60, 46, 26, .1) 45%, rgba(255, 255, 255, .5) 55%, transparent); }

/* ---------- 左页：镜中的那部手机 ---------- */
.lp { position: absolute; left: 0; top: 0; width: 404px; bottom: 0; }
.lp .vt { position: absolute; left: 30px; top: 30px; writing-mode: vertical-rl; font: 400 60px/1 var(--f-splash); color: var(--ink-jiao); }
.lp .vs { position: absolute; left: 98px; top: 36px; writing-mode: vertical-rl; font: 13px/1.9 var(--f-kai); color: var(--ink-zhong); letter-spacing: .3em; }
.lp .disc { position: absolute; left: 100px; top: 124px; width: 312px; height: 312px; border-radius: 50%; background: radial-gradient(circle, rgba(154, 106, 50, .2), rgba(154, 106, 50, .1) 60%, transparent 70%); }
.lp .disc::after { content: ""; position: absolute; inset: -6px; background: var(--zhe); opacity: .7; -webkit-mask: var(--ink-enso-full) 0 0 / 100% 100% no-repeat; mask: var(--ink-enso-full) 0 0 / 100% 100% no-repeat; }
.phone { position: absolute; left: 140px; top: 44px; width: 232px; height: 470px; font-size: 9.6px; }
.phone .scr { position: absolute; inset: 7px; border-radius: 30px; overflow: hidden; background: var(--paper-hi); box-shadow: 0 0 22px rgba(127, 200, 220, .35); }
.phone .scr .mj-home { top: 2em; }
.phone .outline { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.phone .mj-crack { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.phone .mj-clock b { font-size: 3.6em; }
.phone .mj-clock { margin-top: 2em; }
.phone .mj-app .nm { font-size: 1.05em; }
.lp .cap { position: absolute; left: 40px; right: 30px; bottom: 74px; display: flex; align-items: baseline; gap: 10px; font: 22px var(--f-display); color: var(--ink-nong); letter-spacing: .12em; }
.lp .cap::after { content: ""; position: absolute; left: -4px; right: 40px; bottom: -10px; height: 9px; background: var(--ink-zhong); -webkit-mask: var(--ink-stroke-2) 0 0 / 100% 100% no-repeat; mask: var(--ink-stroke-2) 0 0 / 100% 100% no-repeat; }
.lp .cap small { font: 13px var(--f-kai); color: var(--ink-zhong); letter-spacing: .05em; }
.lp .sub { position: absolute; left: 40px; right: 30px; bottom: 26px; font: 12px/1.7 var(--f-ui); color: var(--ink-dan); }
.lp .sub b { font-weight: 400; color: var(--ink-zhong); }

/* ---------- 右页：内容 ---------- */
.rp { position: absolute; left: 424px; right: 0; top: 0; bottom: 0; font-size: 14px; display: flex; flex-direction: column; }
.rp .hd { display: flex; align-items: baseline; gap: 18px; padding: 26px 34px 6px 30px; }
.rp .hd .t { font: 400 40px/1 var(--f-display); letter-spacing: .1em; color: var(--ink-jiao); }
.rp .hd .st { font: 13px var(--f-kai); color: var(--ink-zhong); }
.rp .hd .mj-tabs { margin-left: 18px; font-size: 19px; }
.rp .hd .x { margin-left: auto; }
.rp .rule { margin: 4px 34px 0 30px; height: 8px; background: var(--ink-qing); -webkit-mask: var(--ink-stroke-thin) 0 0 / 100% 100% no-repeat; mask: var(--ink-stroke-thin) 0 0 / 100% 100% no-repeat; }
.rp .ct { flex: 1; min-height: 0; padding: 4px 26px 18px 22px; }
.rp .mj-tl { padding-right: 14px; }
.rp .mj-eh .to { font-size: 1.75em; }
.rp .mj-e { padding: .7em .7em .8em; margin: 0 -.7em; }
.rp .mj-eb.cols { padding: 1em .4em .4em; }
.rp .mj-total { padding: .4em 1.4em; }
.rp .mj-hero .to { font-size: 2.6em; }
.rp .twocol { display: grid; grid-template-columns: 1.25fr 1fr; gap: 26px; padding: 6px 12px; }
.rp .twocol .mj-album { padding: 0; }
.rp .mj-album .grid { grid-template-columns: repeat(4, 1fr); }
.rp .narrow { max-width: 460px; margin: 0 auto; height: 100%; }
.rp .mj-trail .big b { font-size: 2.6em; }
</style>
</head>
<body>
<div class="world"></div>
<div class="veil"></div>
<div class="mount abs"><div class="leaf">
  <div class="lp">
    <div class="disc"></div>
    <div class="vt">天机镜</div>
    <div class="vs">镜开为册　一页是那边　一页是这边</div>
    <div class="phone" id="phone"></div>
    <div class="cap" id="cap"></div>
    <div class="sub"><b>M</b> 合上　<b>Esc</b> 回主屏　点左页手机里的应用翻到右页</div>
  </div>
  <div class="fold"></div>
  <div class="rp" id="rp"></div>
</div></div>
<div id="proto"></div>

<script>
window.MJ_KEEP_OPEN = !1;
const D = MJD;
// 手机外框：一笔焦墨圆角框 + 一道干笔
const OUT = `<svg class="outline" viewBox="0 0 232 470" aria-hidden="true"><g filter="url(#ink-rough)" fill="none" stroke-linecap="round">
<path d="M40 4 H192 Q228 4 228 40 V430 Q228 466 192 466 H40 Q4 466 4 430 V40 Q4 4 40 4 Z" stroke="rgba(21,24,27,.85)" stroke-width="5.5"/>
<path d="M44 9 H188 Q222 9 223 42 V300" stroke="rgba(21,24,27,.3)" stroke-width="1.6" stroke-dasharray="40 6 18 4"/>
<path d="M229 120 V160" stroke="rgba(21,24,27,.8)" stroke-width="4"/><path d="M3 110 V132 M3 142 V176" stroke="rgba(21,24,27,.7)" stroke-width="3.5"/></g></svg>`;

MV.start((S) => {
  document.getElementById("phone").innerHTML = `<div class="scr">${MV.statusBar()}${MV.home()}${D.CRACK}</div>${OUT}`;
  const lit = MV.litKeys().length;
  document.getElementById("cap").innerHTML = `${D.name(MV.prog())}<small>记忆 ${lit} / 10 · ${MV.zhuji() ? "镜中有讯" : "镜中无讯"}</small>`;

  const app = S.app === "home" ? "realm" : S.app; // 册页右页不留空：主屏时默认翻到境界录
  const T = { realm: "境界录", album: "相册", trail: "行迹", msg: S.mtab === "dial" ? "拨号" : "消息", map: "舆图" }[app];
  const sub = { realm: "历次破境，最新在上", album: "那边的日子", trail: "这边的日子", msg: MV.zhuji() ? "发送中……" : "无服务", map: "已知去处" }[app];
  const tabs = app === "realm" ? MV.tabs([["list", "历次"], ["total", "总览"]], S.tab, "tab") : app === "msg" ? MV.tabs([["msg", "消息"], ["dial", "拨号"]], S.mtab, "mtab") : "";
  let c = "";
  if (app === "realm") c = S.tab === "total" ? MV.totals({ cols: !0 }) : MV.realmList({ inline: "cols", chips: 9 });
  if (app === "album") { const k = S.mem || MV.litKeys().slice(-1)[0]; c = `<div class="twocol">${MV.album()}<div>${MV.memView(k)}</div></div>`; }
  if (app === "trail") c = `<div class="narrow">${MV.trail()}</div>`;
  if (app === "msg") c = `<div class="narrow">${MV.msg()}</div>`;
  if (app === "map") c = `<div class="narrow">${MV.mapApp()}</div>`;
  document.getElementById("rp").innerHTML = `<div class="hd"><span class="t">${T}</span><span class="st">${sub}</span>${tabs}<button class="ink-btn x" data-close>合上<span class="keyhint">M</span></button></div><div class="rule"></div>
    <div class="ct ${app === "msg" ? "" : "mj-scroll"}">${c}</div>`;
  // 左页手机上把当前应用圈朱
  document.querySelectorAll("#phone .mj-app").forEach((b) => b.classList.toggle("on", b.dataset.app === app && (!b.dataset.mtab || b.dataset.mtab === S.mtab)));
  document.getElementById("proto").innerHTML = MV.progSwitch("方向 B · 镜开为册");
});
</script>
</body>
</html>
