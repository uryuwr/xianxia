<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>墨途 · 储物袋 v2 · 方向三 博古架</title>
<link rel="stylesheet" href="../kit/strokes.css">
<link rel="stylesheet" href="../kit/ink-ui.css">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="base.css">
<script src="../kit/ink-ui.js"></script>
<style>
/* 左侧压一层渐变薄纸，右侧战场照常可见（世界不暂停） */
.veil { background: linear-gradient(90deg, rgba(238,232,216,.97) 0, rgba(236,230,214,.93) 470px, rgba(236,230,214,.78) 560px, rgba(236,230,214,0) 640px); }
.veil::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 620px; background: var(--ink-tex-paper), var(--ink-tex-fiber); opacity: .55;
  -webkit-mask: linear-gradient(90deg, #000 70%, transparent); mask: linear-gradient(90deg, #000 70%, transparent); }

/* ---------- 匾额 ---------- */
.plaque { left: 40px; top: 14px; display: flex; align-items: center; gap: 18px; }
.plaque .board { position: relative; isolation: isolate; padding: 4px 30px 8px 28px; font: 38px/1.1 var(--f-splash); color: var(--paper-hi); letter-spacing: .1em; }
.plaque .board::before { content: ""; position: absolute; inset: 0 -6px; z-index: -1; background: #4a3220; -webkit-mask: var(--ink-stroke-band) 0 0 / 100% 100% no-repeat; mask: var(--ink-stroke-band) 0 0 / 100% 100% no-repeat; }
.plaque .worth { display: flex; flex-direction: column; }
.plaque .worth .lbl { font: 12px var(--f-kai); color: var(--ink-zhong); letter-spacing: .2em; }
.plaque .worth b { font: 400 34px/1 var(--f-display); color: #8a6a22; }
.plaque .occ { display: flex; flex-direction: column; gap: 3px; font: 12px var(--f-ui); color: var(--ink-zhong); }
.plaque .occ .row { display: flex; align-items: center; gap: 8px; }
.plaque .occ .ink-bar { width: 96px; }
.plaque .occ .full { color: var(--zhu); font-weight: 700; }

/* ---------- 随身 / 行囊 ---------- */
.worn { left: 40px; top: 80px; display: flex; align-items: flex-start; gap: 2px; }
.worn .hd { writing-mode: vertical-rl; font: 15px var(--f-display); color: var(--ink-nong); letter-spacing: .2em; padding-top: 2px; margin-right: 4px; }
.worn .hd small { font: 10px var(--f-ui); color: var(--ink-dan); letter-spacing: 0; }
.sb { position: relative; width: var(--cell); height: var(--cell); --gap: 0px; }
.worn .it { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 54px; }
.worn .it .cap { font: 11px var(--f-kai); color: var(--ink-zhong); white-space: nowrap; }
.worn .slotc { position: absolute; left: -3px; top: -3px; z-index: 5; width: 15px; height: 15px; display: flex; align-items: center; justify-content: center; font: 10px/1 var(--f-display); color: var(--paper-hi); background: var(--ink-zhong); -webkit-mask: var(--ink-seal-sq) 0 0 / 100% 100% no-repeat; mask: var(--ink-seal-sq) 0 0 / 100% 100% no-repeat; transform: rotate(-4deg); }
.worn .it .cap b { font: 11px var(--f-display); color: var(--ink-dan); font-weight: 400; margin-right: 2px; }
.worn .it.cmp .cap { color: var(--zhu); }
.worn .it.cmp .sb::before { content: ""; position: absolute; inset: -5px; border-radius: 50%; background: radial-gradient(closest-side, rgba(184,41,26,.12), transparent); }
.worn .sep { width: 8px; align-self: stretch; margin: 4px 4px 14px; background: var(--ink-qing); -webkit-mask: var(--ink-stroke-v) 0 0 / 100% 100% no-repeat; mask: var(--ink-stroke-v) 0 0 / 100% 100% no-repeat; }
.worn .key { position: absolute; left: -2px; top: -4px; z-index: 5; font: 700 10px var(--f-ui); color: var(--ink-zhong); text-shadow: 0 0 3px var(--paper-hi), 0 0 3px var(--paper-hi); }

/* ---------- 多宝阁 ---------- */
.shelf { left: 40px; top: 146px; width: 402px; height: 274px; }
.shelf::before { /* 背板：一层淡赭墨晕 */ content: ""; position: absolute; inset: 4px; background: rgba(154,106,50,.13); -webkit-mask: var(--ink-wash-1) 0 0 / 100% 100% no-repeat; mask: var(--ink-wash-1) 0 0 / 100% 100% no-repeat; }
.shelf .cloud { position: absolute; top: -22px; width: 70px; height: 26px; background: rgba(74,50,32,.75); -webkit-mask: var(--ink-cloud) 0 0 / 100% 100% no-repeat; mask: var(--ink-cloud) 0 0 / 100% 100% no-repeat; }
.shelf .cloud.l { left: -6px; } .shelf .cloud.r { right: -6px; transform: scaleX(-1); }
#g { position: absolute; left: 14px; top: 14px; --cell: 54px; --gap: 10px; }
#g > .cellmark { display: none; }
/* 龛：内壁上暗下亮（有进深），龛底一抹淡墨投影 */
.niche { position: absolute; background: linear-gradient(rgba(60,38,18,.22), rgba(60,38,18,.07) 30%, rgba(154,106,50,.05) 70%), rgba(245,240,227,.35); }
.niche::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: 2px; height: 22%; max-height: 16px; border-radius: 50%; background: radial-gradient(closest-side, rgba(21,24,27,.2), transparent); }
.niche.sel { background: linear-gradient(rgba(60,38,18,.2), rgba(60,38,18,.06) 30%, rgba(184,41,26,.05) 70%), rgba(250,246,236,.6); }
/* 隔板：毛笔一笔（横 / 竖），不画线框 */
.bd { position: absolute; background: var(--wc, rgba(92,60,30,.86)); }
.bd.h { height: 9px; -webkit-mask: var(--ink-stroke-bar) 0 0 / 100% 100% no-repeat; mask: var(--ink-stroke-bar) 0 0 / 100% 100% no-repeat; }
.bd.h.v2 { -webkit-mask-image: var(--ink-stroke-1); mask-image: var(--ink-stroke-1); height: 10px; }
.bd.v { width: 8px; -webkit-mask: var(--ink-stroke-v) 0 0 / 100% 100% no-repeat; mask: var(--ink-stroke-v) 0 0 / 100% 100% no-repeat; }
.bd.frame { --wc: rgba(52,34,18,.92); }
.bd.h.frame { height: 15px; }
.bd.v.frame { width: 13px; }
/* 选中物与浮签之间：一道淡朱虚笔 */
.lead { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; pointer-events: none; z-index: 20; }

/* ---------- 护身格：阁底带锁暗屉 ---------- */
.drawer { left: 40px; top: 420px; width: 402px; height: 70px; }
.drawer .face { position: absolute; left: 6px; right: 6px; top: 4px; bottom: 2px; background: linear-gradient(rgba(74,50,32,.16), rgba(74,50,32,.06)); }
.drawer .lock { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; display: flex; align-items: center; justify-content: center;
  font: 15px var(--f-display); color: var(--paper-hi); background: #a8862f; -webkit-mask: var(--ink-seal-round) 0 0 / 100% 100% no-repeat; mask: var(--ink-seal-round) 0 0 / 100% 100% no-repeat; }
.drawer .hd { position: absolute; left: 20px; top: 14px; font: 17px var(--f-display); color: var(--ink-nong); letter-spacing: .12em; }
.drawer .hd small { display: block; font: 11px var(--f-ui); color: var(--ink-dan); letter-spacing: 0; margin-top: 3px; }
.drawer .slots { position: absolute; right: 22px; top: 12px; --cell: 46px; --gap: 6px; display: flex; gap: 10px; align-items: center; }
.drawer .slots .sb2 { position: relative; width: 98px; height: 46px; }
.legs { left: 48px; top: 488px; width: 386px; height: 14px; }
.legs i { position: absolute; top: 0; width: 12px; height: 14px; background: rgba(52,34,18,.9); -webkit-mask: var(--ink-stroke-v) 0 0 / 100% 100% no-repeat; mask: var(--ink-stroke-v) 0 0 / 100% 100% no-repeat; }

/* ---------- 贴身锦囊：挂在阁边钉子上 ---------- */
.pouch { left: 454px; top: 140px; width: 146px; }
.pouch .nail { position: absolute; left: 2px; top: 8px; width: 9px; height: 9px; border-radius: 50%; background: rgba(52,34,18,.9); box-shadow: 0 1px 0 rgba(255,255,255,.4); }
.pouch .string { position: absolute; left: 6px; top: 12px; width: 40px; height: 34px; }
.pouch .pic { position: absolute; left: 18px; top: 26px; width: 62px; height: 62px; }
.pouch .pic img.ico { width: 62px; height: 62px; transform: rotate(-6deg); }
.pouch .hd { position: absolute; left: 80px; top: 38px; white-space: nowrap; font: 16px var(--f-display); color: var(--ink-nong); letter-spacing: .1em; line-height: 1.2; }
.pouch .hd small { display: block; font: 11px var(--f-ui); color: var(--ink-dan); letter-spacing: 0; }
.pouch .slot2 { position: absolute; left: 14px; top: 104px; width: 118px; height: 54px; --cell: 54px; --gap: 10px; }
.pouch .slot2::before { /* 锦缎底：一团淡胭脂 */ content: ""; position: absolute; inset: -10px -14px; background: rgba(181,72,90,.12); -webkit-mask: var(--ink-wash-round) 0 0 / 100% 100% no-repeat; mask: var(--ink-wash-round) 0 0 / 100% 100% no-repeat; }
.pouch .note { position: absolute; left: 0px; top: 166px; width: 146px; white-space: nowrap; font: 12px var(--f-kai); color: #8a3a46; text-align: center; }
.pouch .note b { font-weight: 400; color: var(--zhu); }

/* ---------- 脚下：放不下 ---------- */
.ground { left: 454px; top: 330px; width: 146px; }
.ground .hd { font: 15px var(--f-display); color: var(--ink-nong); letter-spacing: .1em; }
.ground .hd small { font: 11px var(--f-ui); color: var(--ink-dan); letter-spacing: 0; margin-left: 4px; }
.ground .ghost { position: relative; margin: 8px 0 0 12px; width: 110px; height: 50px; --cell: 50px; --gap: 10px; }
.ground .ghost::before { content: ""; position: absolute; inset: 30px -10px -6px; border-radius: 50%; background: radial-gradient(closest-side, rgba(21,24,27,.18), transparent); }
.ground .ghost .tok { opacity: .62; }
.ground .msg { margin-top: 8px; font: 12px/1.55 var(--f-kai); color: var(--zhu); }
.ground .msg span { color: var(--ink-zhong); }

/* ---------- 若身陨此地 ---------- */
.ifdie { left: 46px; top: 512px; width: 396px; }
.ifdie .hd { display: flex; align-items: center; gap: 10px; font: 17px var(--f-display); color: var(--ink-nong); letter-spacing: .1em; margin-bottom: 2px; }
.ifdie .hd small { font: 11px var(--f-ui); color: var(--ink-dan); letter-spacing: 0; margin-left: auto; }
.ifdie .ink-row { font-size: 13px; padding: 4px 2px; }
.ifdie .ink-row .k { min-width: 5em; }
.ifdie .ink-row .v { font-size: 14px; }
.ifdie .ink-row .v.loss { color: var(--zhu); }
.ifdie .ink-row .v.safe { color: #2c7d57; }

/* ---------- 详情浮签（战场边缘） ---------- */
.tip { left: 628px; top: 16px; width: 276px; padding: 16px 20px 14px 20px; transform: rotate(-.8deg); }
.tip .top { display: flex; gap: 10px; align-items: center; }
.tip .top .pic { position: relative; width: 84px; height: 42px; --cell: 42px; --gap: 0px; flex: none; }
.tip .nm { font-size: 23px; line-height: 1.1; }
.tip .sub { font: 12px var(--f-kai); color: var(--ink-zhong); margin-top: 3px; white-space: nowrap; }
.tip p { font: 13px/1.65 var(--f-kai); color: var(--ink-nong); margin: 8px 0 4px; }
.tip .cmp { display: grid; grid-template-columns: 3.2em 1fr 1fr 3.2em; font: 13px var(--f-kai); color: var(--ink-zhong); row-gap: 3px; align-items: baseline; }
.tip .cmp .h { font: 11px var(--f-ui); color: var(--ink-dan); }
.tip .cmp .h.me { color: #245f7f; }
.tip .cmp .v { font: 15px var(--f-display); color: var(--ink-nong); }
.tip .cmp .o { font: 13px var(--f-display); color: var(--ink-dan); }
.tip .cmp .d { font: 12px var(--f-ui); text-align: right; }
.tip .rule { height: 6px; margin: 6px 0; background: var(--ink-mist); -webkit-mask: var(--ink-stroke-thin) 0 0 / 100% 100% no-repeat; mask: var(--ink-stroke-thin) 0 0 / 100% 100% no-repeat; }
.tip .affix { font: 13px var(--f-kai); color: #245f7f; }
.tip .affix::before { content: "◆ "; font-size: 9px; vertical-align: 2px; }
.tip .val { display: flex; justify-content: space-between; align-items: baseline; font: 13px var(--f-kai); color: var(--ink-zhong); margin-top: 4px; }
.tip .val b { font: 400 20px var(--f-display); color: #8a6a22; }
.tip .acts { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; white-space: nowrap; }
.tip .ink-btn { font-size: 15px; letter-spacing: .06em; padding: 3px 6px 7px; gap: 4px; }
.tip .ink-btn.primary { font-size: 16px; padding: 5px 14px 7px 12px; }
.tip .ink-btn.dis { color: var(--ink-qing); }
.tip .ink-btn.dis::after { background: var(--ink-qing); }
.tip .why { font: 11px var(--f-ui); color: var(--ink-dan); text-align: right; margin-top: 2px; }

/* ---------- 键位 ---------- */
.keys { left: 46px; top: 690px; font: 12px var(--f-ui); color: var(--ink-zhong); display: flex; gap: 14px; }
.keys b { font-weight: 700; color: var(--ink-nong); border-bottom: 1px solid var(--ink-dan); padding: 0 3px; margin-right: 4px; }
</style>
</head>
<body>
<div class="world"></div>
<div class="veil"></div>

<!-- 匾额 -->
<div class="abs plaque">
  <div class="board">储物袋</div>
  <div class="worth"><span class="lbl">袋中估价</span><b class="ink-num" id="worth"></b></div>
  <div class="occ">
    <div class="row">灵石 <span id="stones"></span></div>
    <div class="row"><span class="full" id="occ"></span><div class="ink-bar thin hp" style="--v:1"><i></i></div></div>
  </div>
  <span class="ink-seal two gold" style="--s:40px;--seal-rot:-5deg">满载</span>
</div>

<!-- 随身 / 行囊 -->
<div class="abs worn" id="worn"></div>

<!-- 多宝阁 -->
<div class="abs shelf">
  <i class="cloud l"></i><i class="cloud r"></i>
  <div id="g"></div>
</div>
<!-- 护身格：阁底暗屉 -->
<div class="abs drawer">
  <div class="face"></div>
  <i class="bd h frame" style="left:-4px;top:-6px;width:410px"></i>
  <i class="bd h frame" style="left:-4px;top:60px;width:410px"></i>
  <i class="bd v frame" style="left:-6px;top:-4px;height:74px"></i>
  <i class="bd v frame" style="left:395px;top:-4px;height:74px"></i>
  <div class="hd">护身格<small>关键物品 · 不占格 · 身陨不失</small></div>
  <div class="lock">锁</div>
  <div class="slots" id="keys"></div>
</div>
<div class="abs legs"><i style="left:0"></i><i style="left:186px"></i><i style="right:0"></i></div>

<!-- 贴身锦囊：挂在阁边 -->
<div class="abs pouch">
  <i class="nail"></i>
  <svg class="string" viewBox="0 0 40 34"><path d="M0 0 C 8 10, 14 18, 30 30" stroke="#b8291a" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".8"/></svg>
  <div class="pic" data-icon="jinnang"></div>
  <div class="hd">贴身锦囊<small>2 / 2 格</small></div>
  <div class="slot2" id="pouch"></div>
  <div class="note"><b>身陨不失</b> · 放入需 1 秒</div>
</div>

<!-- 脚下 -->
<div class="abs ground">
  <div class="hd">脚下<small>1 件</small></div>
  <div class="ghost" id="ground"></div>
  <div class="msg" id="gmsg"></div>
</div>

<!-- 若身陨此地 -->
<div class="abs ifdie">
  <div class="hd"><span class="ink-seal ink" style="--s:24px;font-size:12px">陨</span>若身陨此地<small>青岚山外 · 储物袋留两成</small></div>
  <div class="ink-list" id="die"></div>
</div>

<!-- 详情浮签 -->
<section class="abs ink-paper slip tip" id="tip"></section>

<!-- 选中物 → 浮签的引线 -->


<div class="abs keys"><span><b>Tab</b>合上</span><span><b>拖拽</b>整理</span><span><b>R</b>一键归置</span><span><b>右键</b>丢弃</span><span><b>G</b>放入锦囊</span><span><b>E</b>装备</span></div>
<div class="mocktag">方向三 · 博古架（百宝格）· 储物袋 v2 示意</div>

<script type="module">
import { BAG, POUCH, KEY, WORN, BELT, GROUND, SUM, SEL, RARITY, pack, tok, grid, done } from "./data.js";
const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString("en-US");

// 匾额
$("worth").textContent = fmt(SUM.value);
$("stones").textContent = SUM.stones;
$("occ").textContent = `占格 ${SUM.used} / ${SUM.cap}`;

// 随身 + 行囊
const box = (it, cell, inner = "") => `<div class="sb" style="--cell:${cell}px">${tok(it, { c: 1, r: 1, w: 1, h: 1 })}${inner}</div>`;
let w = `<div class="hd">随身</div>`;
for (const k of ["sword", "robe", "jade", "artifact"]) {
  const it = WORN[k];
  w += `<div class="it${k === "sword" ? " cmp" : ""}">${box(it, 44, `<i class="slotc">${it.slot}</i>`)}<span class="cap">${it.name}${k === "sword" ? " · 比" : ""}</span></div>`;
}
w += `<i class="sep"></i><div class="hd">行囊</div>`;
for (const it of BELT) w += `<div class="it" style="width:48px">${box(it, 40, `<i class="key">${it.key}</i>`)}<span class="cap">${it.name}</span></div>`;
$("worn").innerHTML = w;

// 多宝阁：按摆放结果画龛与隔板
const COLS = 6, ROWS = 4, CELL = 54, GAP = 10;
const placed = pack(BAG, COLS, ROWS);
const g = $("g");
grid(g, BAG, COLS, ROWS, { placed });
const W = COLS * CELL + (COLS - 1) * GAP, H = ROWS * CELL + (ROWS - 1) * GAP;
let back = "";
placed.forEach((p, i) => {
  const x = (p.c - 1) * (CELL + GAP), y = (p.r - 1) * (CELL + GAP);
  const pw = p.w * CELL + (p.w - 1) * GAP, ph = p.h * CELL + (p.h - 1) * GAP;
  back += `<i class="niche${p.it.sel ? " sel" : ""}" style="left:${x - 3}px;top:${y - 3}px;width:${pw + 6}px;height:${ph + 6}px"></i>`;
});
let boards = "";
placed.forEach((p, i) => {
  const x = (p.c - 1) * (CELL + GAP), y = (p.r - 1) * (CELL + GAP);
  const pw = p.w * CELL + (p.w - 1) * GAP, ph = p.h * CELL + (p.h - 1) * GAP;
  if (p.r + p.h - 1 < ROWS) boards += `<i class="bd h${i % 3 === 1 ? " v2" : ""}" style="left:${x - GAP / 2 - 1}px;top:${y + ph + GAP / 2 - 5}px;width:${pw + GAP + 2}px"></i>`;
  if (p.c + p.w - 1 < COLS) boards += `<i class="bd v" style="left:${x + pw + GAP / 2 - 4}px;top:${y - GAP / 2 - 1}px;height:${ph + GAP + 2}px"></i>`;
});
// 外框：顶板厚、两侧立柱、底板
boards += `<i class="bd h frame" style="left:-16px;top:-15px;width:${W + 32}px"></i>`;
boards += `<i class="bd h frame" style="left:-12px;top:${H + 4}px;width:${W + 24}px"></i>`;
boards += `<i class="bd v frame" style="left:-15px;top:-12px;height:${H + 24}px"></i>`;
boards += `<i class="bd v frame" style="left:${W + 2}px;top:-12px;height:${H + 24}px"></i>`;
g.insertAdjacentHTML("afterbegin", back + boards);

// 护身格
$("keys").innerHTML = `<div class="sb2">${tok(KEY[0], { c: 1, r: 1, w: 2, h: 1 })}</div><div class="sb" style="--cell:46px">${tok(KEY[1], { c: 1, r: 1, w: 1, h: 1 })}</div>`;
// 锦囊
$("pouch").innerHTML = tok(POUCH.items[0], { c: 1, r: 1, w: 2, h: 1 });
// 脚下
const gi = GROUND[0];
$("ground").innerHTML = tok(gi, { c: 1, r: 1, w: 2, h: 1, cls: "nofit" });
$("gmsg").innerHTML = `${gi.name}（${gi.sz} 格）放不下<br><span>腾出 2 格即可拾取<br>可丢：铁精石 · 青灵草苗</span>`;

// 若身陨此地
const rows = [["失去", `约 ${fmt(SUM.lose)} 估价`, "loss"], ["法器", "随机 1 件未认主的遗落", ""], ["锦囊护住", "乾坤镜", "safe"], ["护身格", "碧鳞内丹、丹方 · 2 件不失", "safe"], ["斩妖感悟", "已入体，不失", "safe"]];
$("die").innerHTML = rows.map(([k, v, c]) => `<div class="ink-row"><span class="k">${k}</span><span class="v ${c}">${v}</span></div>`).join("");

// 详情浮签：青锋剑 vs 身上锈剑
const s = SEL;
const R = RARITY[s.q];
$("tip").insertAdjacentHTML("beforeend", `
  <div class="top"><div class="pic">${tok({ ...s, sel: 0 }, { c: 1, r: 1, w: 2, h: 1 })}</div>
    <div><div class="nm qname q${s.q}">${s.name}</div><div class="sub"><span class="qtag q${s.q}">${R.name}</span> · ${s.cat} · ${s.sz} 格 · Lv${s.lv}</div></div></div>
  <p>${s.desc}</p>
  <div class="cmp"><span></span><span class="h me">此剑</span><span class="h">身上 · ${s.vs}</span><span></span>
    ${s.stats.map(([k, a, b, d, ud]) => `<span>${k}</span><span class="v">${a}</span><span class="o">${b}</span><span class="d ${ud}">${d.replace("+", "")}</span>`).join("")}</div>
  <div class="rule"></div>
  <div class="affix">${s.affix[0]}</div>
