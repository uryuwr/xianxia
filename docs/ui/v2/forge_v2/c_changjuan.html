<style>
/* ============ 顶栏：丹器房外壳 ============ */
.top { left: 44px; right: 44px; top: 12px; height: 60px; display: flex; align-items: center; gap: 22px; color: var(--paper-hi); z-index: 5; }
.top .ttl { font: 400 40px/1 var(--f-splash); letter-spacing: .06em; color: var(--paper-hi); text-shadow: 0 2px 8px rgba(0,0,0,.35); }
.top .ink-tabs .ink-tab { color: rgba(245,240,227,.5); cursor: pointer; }

.top .ink-tab + .ink-tab::before { color: rgba(245,240,227,.35); }
.top .back { margin-left: auto; color: rgba(245,240,227,.85); }
.top .back::after { background: rgba(245,240,227,.5); }
.top .back .key { color: rgba(245,240,227,.55); border-bottom-color: rgba(245,240,227,.3); }
/* 分类目录：与手卷同向，从右往左 */
.cats { right: 196px; top: 76px; display: flex; flex-direction: row-reverse; gap: 2px; z-index: 6; }
.cats .ink-tab { font-size: 19px; color: rgba(245,240,227,.55); cursor: pointer; padding: 2px 12px 8px; }

.cats .ink-tab::before { content: none; }
.cats .ink-tab.on { color: var(--paper-hi); }
.cats .hint { align-self: center; font: 11px var(--f-ui); color: rgba(245,240,227,.45); margin-right: 10px; }

/* ============ 手卷 ============ */
#scroll { left: 52px; top: 112px; width: 1176px; height: 300px; z-index: 4; }
#scroll .paper { position: absolute; inset: 0; overflow: hidden;
  background: radial-gradient(ellipse 90% 80% at 50% 50%, transparent 60%, rgba(150,125,85,.18)), var(--ink-tex-paper), var(--ink-tex-fiber), var(--paper-hi);
  background-blend-mode: normal, multiply, multiply, normal; box-shadow: 0 10px 26px rgba(0,0,0,.4); }
/* 天地两条淡绫 */
#scroll .paper::before, #scroll .paper::after { content: ""; position: absolute; left: 0; right: 0; height: 10px; background: linear-gradient(var(--silk), #cdbf9f); opacity: .9; z-index: 3; }
#scroll .paper::before { top: 0; } #scroll .paper::after { bottom: 0; }
/* 引首（固定在右端）：卷名 + 炼器鼎挂签 */
.yinshou { position: absolute; right: 0; top: 10px; bottom: 10px; width: 136px; z-index: 4; display: flex; align-items: flex-start; justify-content: center; gap: 12px; padding-top: 16px;
  background: linear-gradient(90deg, rgba(225,216,194,.0), rgba(225,216,194,.95) 18%, #e3d8bd); }
.yinshou::before { content: ""; position: absolute; left: 6px; top: 8%; bottom: 8%; width: 10px; background: var(--ink-zhong); -webkit-mask: var(--ink-stroke-v) 0 0 / 100% 100% no-repeat; mask: var(--ink-stroke-v) 0 0 / 100% 100% no-repeat; opacity: .55; }
.yinshou .jt { writing-mode: vertical-rl; font: 400 48px/1 var(--f-splash); letter-spacing: .1em; color: var(--ink-jiao); }

.fac .ink-seal { --s: 40px; font-size: 15px; transform: rotate(-5deg); }
.fac .lv { font: 400 17px var(--f-display); color: var(--ink-nong); letter-spacing: .1em; }
.fac .up { font: 12px var(--f-kai); color: var(--zhu); border-bottom: 1px dashed var(--zhu); }
.fac .up::before { content: none; }

/* 画心视窗 + 横移的长卷 */
.view { position: absolute; left: 0; right: 136px; top: 10px; bottom: 10px; overflow: hidden; }
.track { position: absolute; right: 0; top: 0; bottom: 0; display: flex; flex-direction: row-reverse; transition: transform .75s var(--ease-ink); }
.seg { position: relative; display: flex; flex-direction: row-reverse; align-items: stretch; padding: 0 22px 0 12px; }
.seg + .seg::after { content: none; }
.track > .sep { flex: none; width: 12px; align-self: center; height: 70%; background: var(--ink-dan); opacity: .45; -webkit-mask: var(--ink-stroke-v) 0 0 / 100% 100% no-repeat; mask: var(--ink-stroke-v) 0 0 / 100% 100% no-repeat; margin: 0 6px 0 18px; }
/* 段首题签 */

.tiqian b { writing-mode: vertical-rl; font: 400 30px/1 var(--f-display); letter-spacing: .3em; color: var(--ink-jiao); }
.tiqian .ink-tiba { font-size: 13px; line-height: 1.7; color: var(--ink-zhong); }

/* 器谱条目 */
.items { display: flex; flex-direction: row-reverse; align-items: flex-start; gap: 4px; padding-top: 30px; }
.ent { position: relative; width: 116px; display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 6px 0 8px; }
.ent .nm { margin-top: 6px; font: 400 18px/1.15 var(--f-display); letter-spacing: .06em; color: var(--ink-nong); text-align: center; white-space: nowrap; }

.ent .st .ok { color: #2c7d57; }
.ent .mm { display: flex; gap: 2px; justify-content: center; margin-top: 4px; flex-wrap: wrap; max-width: 112px; }
.ent .mm .tk::after { opacity: .3; }
.ent.lock { opacity: .62; }
.seg.dim .ent.lock { opacity: .5; }

.c1 + .col::before, .c2 + .col::before, .c3 + .col::before { content: ""; position: absolute; left: -16px; top: 4%; bottom: 4%; width: 8px; background: var(--ink-qing); -webkit-mask: var(--ink-stroke-v) 0 0 / 100% 100% no-repeat; mask: var(--ink-stroke-v) 0 0 / 100% 100% no-repeat; }

.desc { font: 13px/1.65 var(--f-kai); color: var(--ink-zhong); margin: 0; }
/* 材料：一排圆相签 */

.mt { display: flex; flex-direction: column; align-items: center; width: 62px; cursor: pointer; position: relative; }
.mt .c { font: 12px var(--f-ui); color: var(--ink-zhong); font-variant-numeric: tabular-nums; margin-top: 1px; white-space: nowrap; }
.mt .c b { font: 400 15px var(--f-display); color: var(--ink-nong); }
.mt .c .no { color: var(--zhu); } .mt .c .ok { color: #2c7d57; }
.mt .l { font: 11px var(--f-ui); color: var(--ink-dan); white-space: nowrap; }
.mt.short .c b { color: var(--zhu); }
.mt.pinned::after { content: "挂念"; position: absolute; left: 0; top: -2px; font: 10px/1 var(--f-display); color: var(--paper-hi); background: var(--zhu); padding: 2px 2px 3px; z-index: 5; -webkit-mask: var(--ink-seal-sq) 0 0 / 100% 100% no-repeat; mask: var(--ink-seal-sq) 0 0 / 100% 100% no-repeat; transform: rotate(-8deg); }
.stone { display: inline-flex; align-items: center; gap: 4px; font: 13px var(--f-ui); color: var(--ink-zhong); margin-top: 8px; }
.stone .ink-seal { --s: 18px; font-size: 10px; --seal-color: #8f6f25; }
.stone b { font: 400 16px var(--f-display); color: #8a6a22; }
.stone.short b { color: var(--zhu); }
/* 主材品质 */
.qpick { display: flex; gap: 10px; margin-bottom: 8px; }
.qp { display: flex; flex-direction: column; align-items: center; cursor: pointer; width: 54px; }
.qp .lab { font: 400 17px/1.1 var(--f-display); color: var(--qt); margin-top: 1px; }
.qp small { font: 11px var(--f-ui); color: var(--ink-dan); white-space: nowrap; }
.qp.dis { cursor: default; }
.qp.dis .lab { color: var(--ink-qing); }
.qp.dis small { color: var(--zhu); opacity: .75; }
.rule { font: 11.5px/1.5 var(--f-ui); color: var(--ink-zhong); margin-top: 4px; }
.rule b { color: var(--ink-nong); font-weight: 400; font-family: var(--f-kai); font-size: 13px; }
/* 预览 */
.pv { display: flex; gap: 14px; }
.pv .one { flex: 1; min-width: 0; }
.pv .one .h { font: 400 18px var(--f-display); color: var(--qt); display: flex; align-items: baseline; gap: 6px; }
.pv .one .h small { font: 11px var(--f-ui); color: var(--ink-dan); }
.ln { display: flex; justify-content: space-between; align-items: baseline; font: 13px var(--f-kai); color: var(--ink-zhong); padding: 2px 0; gap: 8px; }
.ln b { font: 400 15px var(--f-display); color: var(--ink-nong); white-space: nowrap; }
.ln .up, .ln .down { font: 11.5px var(--f-ui); }
.ln.af b { color: var(--qt); font-family: var(--f-kai); font-size: 13px; }
.cmpw { font: 11.5px var(--f-ui); color: var(--ink-dan); margin-top: 6px; }
.big { display: flex; align-items: center; gap: 16px; margin: 4px 0 8px; }
.big .from, .big .to { font: 400 40px/1 var(--f-display); color: var(--ink-zhong); }
.big .to { color: var(--ink-jiao); }
.big .arr { width: 80px; height: 14px; background: var(--ink-nong); -webkit-mask: var(--ink-stroke-2) 0 0 / 100% 100% no-repeat; mask: var(--ink-stroke-2) 0 0 / 100% 100% no-repeat; }
.big small { font: 13px var(--f-kai); color: var(--ink-zhong); }
.why { font: 12px var(--f-ui); color: var(--zhu); text-align: center; line-height: 1.5; }
.why.k { color: var(--ink-dan); }
.c4 .ink-seal-btn { --s: 96px; font-size: 30px; }
.c4 .note { font: 11px var(--f-ui); color: var(--ink-dan); text-align: center; }
.rfacts { display: flex; gap: 14px; justify-content: center; margin-top: 10px; }
.rfacts .ink-btn { font-size: 17px; letter-spacing: .06em; white-space: nowrap; }
.rfacts .ink-btn.primary { font-size: 17px; padding: 8px 22px 9px 18px; }

/* ============ 浮签 / 弹层 ============ */
.pop { position: absolute; z-index: 60; width: 236px; padding: 14px 18px 12px; }
.pop .t { font: 400 19px var(--f-display); color: var(--ink-nong); letter-spacing: .06em; }
.pop .t small { font: 12px var(--f-ui); color: var(--zhu); margin-left: 6px; letter-spacing: 0; }
.pop ul { margin: 6px 0 8px; padding: 0; list-style: none; }
.pop li { font: 12.5px/1.6 var(--f-kai); color: var(--ink-zhong); }
.pop li::before { content: "得 "; display: inline-block; font: 10px/14px var(--f-display); width: 14px; height: 14px; text-align: center; margin-right: 4px; color: var(--paper-hi); background: var(--zhe); -webkit-mask: var(--ink-seal-round) 0 0 / 100% 100% no-repeat; mask: var(--ink-seal-round) 0 0 / 100% 100% no-repeat; vertical-align: 1px; }
.pop .ft { display: flex; justify-content: space-between; align-items: center; font: 11px var(--f-ui); color: var(--ink-dan); }
.mask { position: absolute; inset: 0; z-index: 90; background: rgba(21,24,27,.42); display: flex; align-items: center; justify-content: center; }
.modal { width: 620px; padding: 26px 34px 22px; }
.modal .mt1 { display: flex; align-items: center; gap: 14px; }
.modal .mt1 .n { font: 400 32px var(--f-display); letter-spacing: .1em; }
.modal .lvs { display: grid; grid-template-columns: 1fr 50px 1fr; gap: 6px; margin: 14px 0 10px; }
.modal .lvs .ar { align-self: center; height: 14px; background: var(--ink-dan); -webkit-mask: var(--ink-stroke-2) 0 0 / 100% 100% no-repeat; mask: var(--ink-stroke-2) 0 0 / 100% 100% no-repeat; }
.modal .lv h5 { margin: 0 0 4px; font: 400 22px var(--f-display); color: var(--ink-nong); letter-spacing: .12em; }
.modal .lv.cur h5 { color: var(--ink-zhong); }
.modal .lv li { font: 13px/1.7 var(--f-kai); color: var(--ink-zhong); list-style: none; }
.modal .lv.nx li { color: var(--ink-nong); }
.modal .lv.nx li.new::before { content: "新 "; color: var(--zhu); font-family: var(--f-display); }
.modal ul { margin: 0; padding: 0; }
.modal .cost { display: flex; gap: 12px; align-items: flex-end; margin-top: 4px; }
.modal .cond { margin-top: 10px; font: 13px var(--f-kai); }
.modal .cond.bad { color: var(--zhu); } .modal .cond.ok { color: #2c7d57; }

  <div class="ttl">丹器房</div>
  <div class="ink-tabs"><span class="ink-tab" data-t="炼丹">炼丹</span><span class="ink-tab on">炼器</span><span class="ink-tab" data-t="药园">药园</span></div>

</div>

<div class="mocktag">方向三 · 器谱长卷</div>

<script>
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const RAR = FG.RAR, CN = "〇一二三四五六七八九";
  const st = { cat: "gear", sel: {}, q: {}, rfIdx: null, rfRoll: null, pop: null };
  const S = () => FG.S;
  const segOf = {};
  const toast = (t, c = "") => { const e = document.createElement("div"); e.className = "ink-toast " + c; e.textContent = t; $("#toasts").appendChild(e); setTimeout(() => e.remove(), 2400); };

  // ---------------- 数据视图 ----------------
  const listOf = (cat) => cat === "reforge" ? FG.reforgeables() : cat === "bind" ? S().gear : FG.RECIPES.filter((r) => r.kind === cat);
  const keyOf = (cat, x) => (cat === "reforge" || cat === "bind" ? x.uid : x.id);
  const gName = (g) => FG.name(g.id);
  const slotName = { sword: "法剑", robe: "法衣", jade: "玉佩" };
  function defaultQ(r) {
    if (st.q[r.id] != null) return st.q[r.id];
    const m = FG.mainOf(r), need = r.inputs[m];
    let q = FG.has(m, 1) >= need ? 1 : -1;
    if (q < 0) for (let i = 3; i >= 0; i--) if (FG.has(m, i) >= need) { q = i; break; }
    return (st.q[r.id] = q < 0 ? 0 : q);
  }
  function entState(cat, x) {
    if (cat === "reforge") return { cls: "", st: `${RAR[x.rarity].name} · 重铸 ${x.reforged || 0} 次`, tag: x.worn ? "身上" : "" };
    if (cat === "bind") {
      if (S().forgeLv < 2) return { cls: "lock", st: '<span class="lk">二阶鼎可认主</span>', tag: x.worn ? "身上" : "" };
      return { cls: "", st: x.bound ? '<span class="ok">已认主</span>' : RAR[x.rarity].name, tag: x.bound ? "主" : x.worn ? "身上" : "", tagc: x.bound ? "z" : "" };
    }
    const c = FG.check(x, x.kind === "gear" ? { q: defaultQ(x) } : {});
    if (c.ok) return { cls: "", st: '<span class="ok">可炼</span>' + (x.kind === "item" ? ` · 现有 ${FG.has(x.out)}` : "") };
    if (c.done) return { cls: "done", st: `<span class="lk">${c.why}</span>`, tag: "成", tagc: "g" };
    if (c.lock) return { cls: "lock", st: `<span class="lk">${c.why}${c.how ? "<br>" + c.how.split(" · ").slice(-1)[0] : ""}</span>` };
    const n = c.lack.length;
    return { cls: "miss", st: `<span class="no">缺 ${n} 味</span>` + (x.kind === "item" ? ` · 现有 ${FG.has(x.out)}` : "") };
  }
  function miniRow(cat, x, es) {
    if (cat === "reforge") return `<div class="afx">${x.affixes.map((a) => { const L = FG.affixLabel(a); return `<span class="${L.lock ? "lk" : ""}">${L.k} ${L.v}</span>`; }).join("")}</div>`;
    if (cat === "bind" || es.cls.includes("lock") || es.cls.includes("done")) return "";

    const [cx, cy] = entCenter();
    if (res.gear) {
      const g = res.gear, rr = g.rarity;
      FG.stamp($("#scroll"), cx, cy, { q: rr, text: RAR[rr].name, size: 92 });
      const bs = FG.baseStats(g.id, g.level, rr);
      showResult(`<div class="hd">${FG.tok(g.id, { q: rr, s: 58 })}<div><div class="nm qt q${rr}">${FG.name(g.id)}</div><div class="sub">${RAR[rr].name} · ${slotName[FG.ITEM[g.id].slot]} · 已鉴定 · 入仓库${res.up ? ' · <span style="color:var(--zhu)">火候正好，升了一品</span>' : ""}</div></div></div><div style="margin-top:8px">${bs.map((b) => `<div class="ln"><span>${FG.STAT[b.stat]}</span><b>${FG.fmt(b.stat, b.v).replace("+", "")}</b></div>`).join("")}${g.affixes.map((a) => { const L = FG.affixLabel(a); return `<div class="ln af"><span>${L.k}</span><b>${L.v}</b></div>`; }).join("")}</div>`, rr);
      toast(`炼成 ${RAR[rr].name}${FG.name(g.id)}`, "gold");
    } else if (res.item) {
      FG.stamp($("#scroll"), cx, cy, { q: 0, text: "炼成", size: 84, bloom: !1 });
      toast(`炼成 ${FG.name(res.item)} ×${res.n}`, "gold");
    } else if (res.upgrade) {
      FG.stamp($("#scroll"), cx, cy, { q: 2, text: "扩容", size: 84, sealCls: "" });
      toast(res.upgrade === "bag" ? `储物袋扩至 ${S().bag} 格` : res.upgrade === "pouch" ? `贴身锦囊扩至 ${S().pouch} 格` : `丹药栏每栏可放 ${S().pillCap} 枚`, "gold");
    } else if (res.imbue) {
      FG.stamp($("#scroll"), cx, cy, { q: res.rarity, text: "附灵", size: 84 });
      toast(`法剑附灵 · ${FG.EL[res.imbue]}`, "gold");
    }
  }
  function modal(html, onOk) {
    document.body.insertAdjacentHTML("beforeend", `<div class="mask" id="mask"><section class="ink-paper modal">${html}</section></div>`);
    inkui.decorate();
    const m = $("#mask");
    m.onclick = (e) => e.target === m && m.remove();
    m.querySelectorAll("[data-close]").forEach((b) => (b.onclick = () => m.remove()));
    const ok = $("#m-ok", m);
    if (ok) ok.onclick = () => !ok.classList.contains("is-disabled") && (FG.press(ok), setTimeout(() => (m.remove(), onOk()), 160));
  }
  function confirmBind(g) {
    modal(`<div class="mt1"><span class="n">滴血认主</span><span class="ink-seal frame two" style="--s:44px">慎</span></div><p class="desc" style="font-size:15px;margin-top:10px">以精血祭炼「<span class="qt q${g.rarity}">${FG.name(g.id)}</span>」？<br>此后身陨不遗落；代价：灵石 100，<b style="color:var(--zhu)">下一局气血上限 −10%</b>。<br>只能认一件，改认他物原先那件便解除。</p><div class="ft"><span class="ink-btn" data-close>罢了</span><button class="ink-seal-btn" id="m-ok">认主</button></div>`, () => {
      S().gear.forEach((x) => (x.bound = !1));
      g.bound = !0;
      FG.take("spirit_stone", 100);
      renderAll();
      const [cx, cy] = entCenter();
      FG.stamp($("#scroll"), cx, cy, { q: 4, text: "认主", size: 84, sealCls: "" });
      toast(`${FG.name(g.id)} 认主已成`, "gold");
    });
  }
  function openUp() {
    const lv = S().forgeLv, F = FG.FORGE_FAC;
    if (lv >= 2) return modal(`<div class="mt1"><span class="n">炼器鼎 · 二阶</span><span class="ink-seal two">二阶</span></div><p class="desc">已是此鼎最高一阶。</p><div class="ft"><span class="ink-btn" data-close>好</span></div>`);
    const c = F.cost[lv], rows = Object.entries(c.items).map(([id, n]) => ({ id, name: FG.name(id), need: n, have: FG.has(id), q: null }));
    rows.push({ stone: !0, need: c.stones, have: FG.has("spirit_stone") });
    const enough = rows.every((r) => r.have >= r.need), place = !c.relocate || S().relocated;
    const cur = (F.effect[lv] || ["鼎身碎裂，不能炼器"]).map((e) => `<li>${e}</li>`).join("");
    const nx = F.effect[lv + 1].map((e) => `<li class="${/解锁|灵品/.test(e) ? "new" : ""}">${e}</li>`).join("");
    modal(`<div class="mt1"><span class="n">炼器鼎 · 升阶</span><span class="ink-seal two">${F.lv[lv]}</span></div>
      <div class="lvs"><div class="lv cur"><h5>${F.lv[lv]}（现）</h5><ul>${cur}</ul></div><i class="ar"></i><div class="lv nx"><h5>${F.lv[lv + 1]}</h5><ul>${nx}</ul></div></div>
      <div class="col"><h4>花费</h4>${matsHTML(rows)}</div>
      ${c.relocate ? `<div class="cond ${place ? "ok" : "bad"}">${place ? "✓ 已搬迁到竹海·溪谷灵脉" : "需先搬迁到竹海·溪谷灵脉（灵脉不足，鼎火上不去）"}</div>` : ""}
      <div class="ft"><span class="ink-btn" data-close>暂且</span><button class="ink-seal-btn ${enough && place ? "" : "is-disabled"}" id="m-ok">升阶</button></div>`, () => {
      const r = FG.upgradeForge();
      if (!r.ok) return toast(r.why, "zhu");
      renderAll();
      const f = $("#fac").getBoundingClientRect(), s = $("#scroll").getBoundingClientRect();
      FG.stamp($("#scroll"), f.left + f.width / 2 - s.left, f.top + 20 - s.top, { q: 3, text: F.lv[S().forgeLv], size: 76 });
      toast(`炼器鼎升至${F.lv[S().forgeLv]} · 品质下限灵品 · 认主已开`, "gold");
    });
  }
  function matPop(id, el) {
    const old = $(".pop"); if (old) { const same = old.dataset.id === id; old.remove(); if (same) return; }
    const it = FG.ITEM[id], b = el.getBoundingClientRect();
    const pinned = !!S().pins[id];
    document.body.insertAdjacentHTML("beforeend", `<section class="ink-paper slip pop tilt-l" data-id="${id}" style="left:${Math.min(b.left - 20, 1020)}px;top:0;visibility:hidden"><div class="t">${it.name}<small>${FG.has(id)} 份在库</small></div><ul>${(it.src || []).map((s) => `<li>${s}</li>`).join("")}</ul><div class="ft"><span class="pin ${pinned ? "on" : ""}" id="pin">${pinned ? "已挂念 · 出行准备里会提醒" : "挂念此物"}</span><span>Esc 收起</span></div></section>`);
    inkui.decorate();
    { const P = $(".pop"); P.style.top = Math.max(90, b.top - P.offsetHeight - 6) + "px"; P.style.visibility = ""; }
    $("#pin").onclick = () => { S().pins[id] = !S().pins[id]; $(".pop").remove(); renderDetail(); toast(S().pins[id] ? `已挂念 ${it.name}：出行准备与天机镜会标出产地` : `不再挂念 ${it.name}`); };
  }

  function renderAll() { renderScroll(); renderDetail(); }
  function goCat(k) {
    if (st.cat === k) return;
    st.cat = k; st.rfIdx = null; st.rfRoll = null;
    const p = $(".pop"); if (p) p.remove();
    const L = $("#scroll > .stamp-layer"); if (L) L.innerHTML = "";
    renderScroll(); pan(!0); renderDetail();
  }

  // ---------------- 事件 ----------------
  document.addEventListener("click", (e) => {
    const t = e.target;
    const c = t.closest("#cats [data-cat]"); if (c) return goCat(c.dataset.cat);
    if (t.closest("[data-goup]")) return openUp();
    if (t.closest("#fac")) return openUp();
    const en = t.closest(".ent");
    if (en) {
      if (st.rfRoll) return toast("先定新旧词条的去留", "zhu");
      const k = en.dataset.cat;
      if (k !== st.cat) { st.cat = k; st.rfIdx = null; pan(!0); }
      st.sel[k] = en.dataset.key; st.rfIdx = k === "reforge" ? null : st.rfIdx;
      const p = $(".pop"); if (p) p.remove();
      return renderAll();
    }
    const qp = t.closest(".qp");
    if (qp) { if (qp.classList.contains("dis")) return toast("这一档主材不够数", "zhu"); const r = FG.RECIPES.find((x) => x.id === st.sel.gear); st.q[r.id] = +qp.dataset.q; return renderAll(); }
    const mt = t.closest(".mt[data-mat]"); if (mt) return matPop(mt.dataset.mat, mt);
    const af = t.closest(".rf-row[data-aff]");
    if (af && !af.classList.contains("off")) { if (st.rfRoll) return; st.rfIdx = +af.dataset.aff; return renderDetail(); }
    if (af) return toast("附灵词条不能重铸，请走「附灵」");
    if (t.id === "rf-keep" || t.id === "rf-ok") {
      const R = st.rfRoll, g = S().gear.find((x) => x.uid === R.uid);
      if (t.id === "rf-ok") { g.affixes[R.idx] = R.neo; const n = FG.affixLabel(R.neo); toast(`${FG.name(g.id)}：${n.k} ${n.v}`, "gold"); }
      else toast("原词条未动；灵石已耗去");
      st.rfRoll = null; return renderAll();
    }
    const ch = t.closest(".cheat a");
    if (ch) { const k = ch.dataset.c; k === "reset" ? (FG.reset(), (st.q = {}), (st.rfRoll = null), (st.rfIdx = null)) : FG.cheat(k); toast({ mats: "材料已补齐", move: "已搬迁到竹海·溪谷", recipe: "得器方《法衣》", reset: "已重置" }[k]); return renderAll(); }
    const tb = t.closest(".top .ink-tab[data-t]"); if (tb) return toast(`切到「${tb.dataset.t}」（示意里不展开）`);
    if (t.closest(".back")) return toast("回洞府（示意）");
    if (!t.closest(".pop")) { const p = $(".pop"); if (p) p.remove(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { const m = $("#mask") || $(".pop") || $(".result"); if (m) m.remove(); }
    if (e.key === "Enter") { const g = $("#go"); if (g && !$("#mask")) g.click(); }
  });
  $(".view").addEventListener("wheel", (e) => { e.preventDefault(); setPan(panX - (e.deltaY || e.deltaX) * 0.8, !1); }, { passive: !1 });

  const hm = /cat=(\w+)/.exec(location.hash);
  if (hm && FG.CATS.some((c) => c[0] === hm[1])) st.cat = hm[1];
  renderAll();
  if (/reveal=1/.test(location.hash) && st.cat === "reforge") { FG.cheat("mats"); st.rfIdx = 0; renderAll(); $("#go").click(); }
  setTimeout(() => document.body.classList.remove("opening"), 600);
  window.__ready = !0;
})();
</script>
</body></html>
