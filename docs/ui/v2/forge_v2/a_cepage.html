<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>炼器 v2 · 方向一 · 册页</title>
<link rel="stylesheet" href="../../../../src/ui/ink/strokes.css"><link rel="stylesheet" href="../../../../src/ui/ink/ink-ui.css"><link rel="stylesheet" href="common.css">
<script src="../../../../src/ui/ink/ink-ui.js"></script>
<style>
/* 方向一 · 册页：与灵泉·静室（境界册页）同一套装裱。左页 = 器方目录，右页 = 详情与炼制 */
.album { left: 46px; top: 34px; width: 1188px; height: 652px; padding: 16px; box-sizing: border-box; animation: inkIn .45s .1s var(--ease-ink) both; }
.album .ink-mount-in { display: flex; height: 100%; }
.album .fold { position: absolute; left: 488px; top: 0; bottom: 0; width: 18px; margin-left: -9px; background: linear-gradient(90deg, transparent, rgba(90,70,40,.16) 45%, rgba(255,255,255,.35) 55%, transparent); z-index: 2; pointer-events: none; }
.page { position: relative; height: 100%; }
#lp { flex: 0 0 488px; }
#rp { flex: 1; }

/* ---- 左页 ---- */
.lp-title { position: absolute; left: 30px; top: 30px; display: flex; gap: 10px; }
.lp-title .t { writing-mode: vertical-rl; font: 400 58px/1 var(--f-splash); color: var(--ink); letter-spacing: .04em; }
.lp-title .ink-tiba { margin-top: 8px; font-size: 13px; }
.shell { position: absolute; left: 128px; top: 22px; display: flex; align-items: baseline; gap: 2px; }
.shell .ink-tab { font-size: 17px; padding: 2px 10px 6px; cursor: pointer; }
.cats { position: absolute; left: 124px; top: 64px; right: 10px; display: flex; flex-wrap: nowrap; }
.cats .ink-tab { font-size: 18px; letter-spacing: .04em; padding: 4px 8px 8px; cursor: pointer; white-space: nowrap; }
.cats .ink-tab:hover { color: var(--ink-nong); }
.cats .ink-tab.locked:hover { color: var(--ink-dan); }
.cats .ink-tab sup { font: 10px var(--f-ui); color: var(--ink-dan); margin-left: 1px; letter-spacing: 0; vertical-align: 6px; }
.list { position: absolute; left: 128px; right: 22px; top: 112px; }
.row { position: relative; display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 6px 0 2px; cursor: pointer; }
.row + .row::before { content: ""; position: absolute; left: 50px; right: 30%; top: 0; height: 6px; background: var(--ink-mist); -webkit-mask: var(--ink-stroke-thin) 0 0 / 100% 100% no-repeat; mask: var(--ink-stroke-thin) 0 0 / 100% 100% no-repeat; }
.row .nm { flex: 1; min-width: 0; }
.row .nm b { display: block; font: 400 19px/1.15 var(--f-display); letter-spacing: .06em; color: var(--ink-nong); }
.row .nm small { display: block; font: 11.5px/1.5 var(--f-ui); color: var(--ink-dan); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .st { font: 14px var(--f-kai); white-space: nowrap; }
.row .st.ok { color: #2c7d57; } .row .st.lack { color: var(--zhu); } .row .st.lock, .row .st.done { color: var(--ink-dan); }
.row.lock .nm b { color: var(--ink-dan); }
.row.on::after { content: ""; position: absolute; left: -12px; right: -8px; top: 4px; bottom: 4px; z-index: -1; background: rgba(184,41,26,.10); -webkit-mask: var(--ink-stroke-band) 0 0 / 100% 100% no-repeat; mask: var(--ink-stroke-band) 0 0 / 100% 100% no-repeat; }
.row.on .nm b::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--zhu); margin-right: 6px; vertical-align: 4px; }
.row:hover .tk::after { opacity: .95; }
.list .empty { font: 14px var(--f-kai); color: var(--ink-dan); padding: 20px 4px; line-height: 1.9; }
/* 左页页脚：炼器鼎（设施）独立一栏，不进配方卡 */
.fac { position: absolute; left: 30px; right: 26px; bottom: 26px; padding-top: 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
.fac::before { content: ""; position: absolute; left: 0; right: 10%; top: 0; height: 8px; background: var(--ink-qing); -webkit-mask: var(--ink-stroke-1) 0 0 / 100% 100% no-repeat; mask: var(--ink-stroke-1) 0 0 / 100% 100% no-repeat; }
.fac .ding { width: 54px; height: 54px; flex: none; }
.fac .t { font: 400 20px var(--f-display); letter-spacing: .1em; color: var(--ink-nong); }
.fac .d { font: 12px/1.6 var(--f-ui); color: var(--ink-zhong); }
.fac .go { margin-left: auto; font: 17px var(--f-display); letter-spacing: .1em; color: var(--ink-nong); white-space: nowrap; }
.fac .go small { display: block; font: 11px var(--f-ui); color: var(--ink-dan); letter-spacing: 0; text-align: right; }
.fac:hover .go { color: var(--zhu); }

/* ---- 右页 ---- */
.back { position: absolute; right: 26px; top: 20px; z-index: 3; }
.back .ink-btn { font-size: 19px; }
#rp > .hd { position: absolute; left: 40px; right: 150px; top: 30px; display: flex; gap: 18px; align-items: center; }
#rp > .hd .info { min-width: 0; }
#rp > .hd .nm { font: 400 34px/1.1 var(--f-display); letter-spacing: .06em; color: var(--ink); transition: color .3s; }
#rp > #rp > .hd .nm.qt, .row .nm b.qt, .mat .nm.qt { color: var(--qt); }
#rp > .hd .sub { font: 13px var(--f-kai); color: var(--ink-zhong); margin-top: 5px; letter-spacing: .04em; }
#rp > .hd .sub i { font-style: normal; color: var(--ink-qing); margin: 0 5px; }
#rp > .hd .desc { font: 13.5px/1.6 var(--f-kai); color: var(--ink-zhong); margin-top: 3px; }
.cols { position: absolute; left: 40px; right: 34px; top: 160px; display: grid; grid-template-columns: 330px 1fr; column-gap: 34px; }
.cols .ink-h { font-size: 19px; margin-bottom: 6px; display: flex; align-items: baseline; gap: 10px; }
.cols .ink-h small { font: 11px var(--f-ui); color: var(--ink-dan); letter-spacing: 0; }
/* 主材定品 */
.mq { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
.mq .c { display: flex; flex-direction: column; align-items: center; cursor: pointer; width: 60px; position: relative; }
.mq .c small { font: 11px var(--f-ui); color: var(--ink-zhong); margin-top: 1px; white-space: nowrap; }
.mq .c small b { font: 400 13px var(--f-display); }
.mq .c.no { cursor: default; } .mq .c.no .tk > .ico { opacity: .35; filter: grayscale(.8); } .mq .c.no small { color: var(--zhu); }
.mq .c.on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -6px; height: 7px; background: var(--zhu); -webkit-mask: var(--ink-stroke-thin) 0 0 / 100% 100% no-repeat; mask: var(--ink-stroke-thin) 0 0 / 100% 100% no-repeat; }
.mq .lab { font: 13px/1.5 var(--f-kai); color: var(--ink-zhong); width: 56px; padding-top: 8px; }
.mq .lab b { display: block; font: 400 16px var(--f-display); color: var(--ink-nong); }
.rule-note { font: 11.5px/1.6 var(--f-ui); color: var(--ink-dan); margin: 2px 0 10px; }
/* 炼成所得：可能品级 × 属性（与身上比） */
.pv { width: 100%; border-collapse: collapse; font-size: 14px; }
.pv th { font: 400 15px var(--f-display); text-align: right; padding: 2px 4px 4px; white-space: nowrap; }
.pv th small { font: 11px var(--f-ui); color: var(--ink-dan); margin-left: 3px; }
.pv th:first-child { text-align: left; }
.pv td { padding: 3px 4px; text-align: right; font: 400 16px var(--f-display); color: var(--ink-nong); white-space: nowrap; }
.pv td:first-child { text-align: left; font: 14px var(--f-kai); color: var(--ink-zhong); }
.pv td.worn, .pv th.worn { color: var(--ink-dan); font-size: 14px; }
.pv td small { font: 11px var(--f-ui); margin-left: 3px; }
.pv tr + tr td { background: linear-gradient(90deg, var(--ink-mist), transparent 70%) 0 0 / 100% 1px no-repeat; }
/* 所需材料 */
.mats .mat { padding: 4px 0; }
.mats .mat + .mat { background: linear-gradient(90deg, var(--ink-mist), transparent 70%) 0 0 / 100% 1px no-repeat; }
.mats .mat .body { flex: 1; min-width: 0; }
.mats .mat .top { display: flex; align-items: baseline; gap: 6px; }
.mats .mat .src { line-height: 1.5; }
.mats .mat .pin { margin-left: 8px; }
.mats .mat .mq-tag { font: 11px var(--f-ui); color: var(--ink-dan); margin-left: 2px; }
/* 页底：说明 + 灵石 + 朱印 */
.foot { position: absolute; left: 40px; right: 34px; bottom: 26px; display: flex; align-items: flex-end; gap: 18px; }
.foot .why { flex: 1; font: 14px/1.7 var(--f-kai); color: var(--ink-zhong); padding-bottom: 6px; }
.foot .why b { font-weight: 400; color: var(--zhu); }
.foot .why .ok { color: #2c7d57; }
.foot .stone { display: flex; align-items: center; gap: 6px; padding-bottom: 10px; font: 13px var(--f-ui); color: var(--ink-zhong); white-space: nowrap; }
.foot .stone b { font: 400 22px var(--f-display); color: #8a6a22; }
.foot .ink-seal-btn { flex: none; }
.foot .ink-seal-btn.is-disabled { background: #a9a49a; }
/* 扩容：格子前后 */
.cells { display: flex; flex-wrap: wrap; gap: 5px; width: 300px; margin: 6px 0 8px; }
.cells i { width: 18px; height: 18px; background: var(--ink-dan); -webkit-mask: var(--ink-enso-2) 0 0 / 100% 100% no-repeat; mask: var(--ink-enso-2) 0 0 / 100% 100% no-repeat; }
.cells i.n { background: var(--r1); animation: inkIn .4s var(--ease-ink) both; }
.big-arrow { font: 400 30px var(--f-display); color: var(--ink-nong); display: flex; align-items: baseline; gap: 12px; }
.big-arrow small { font: 13px var(--f-kai); color: var(--ink-zhong); }
.big-arrow em { font-style: normal; color: #2c7d57; }
.el-pair { display: flex; align-items: center; gap: 14px; margin: 8px 0; }
.el-pair .ink-seal { --s: 46px; font-size: 22px; }
.el-pair .old { opacity: .45; text-decoration: line-through; }
.kv { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; font: 14px var(--f-kai); color: var(--ink-zhong); }
.kv b { font: 400 17px var(--f-display); color: var(--ink-nong); }
.kv + .kv { background: linear-gradient(90deg, var(--ink-mist), transparent 70%) 0 0 / 100% 1px no-repeat; }
.para { font: 14px/1.8 var(--f-kai); color: var(--ink-zhong); }
.pool { font: 11.5px/1.7 var(--f-ui); color: var(--ink-dan); margin-top: 8px; }
.rf-acts { display: flex; gap: 22px; justify-content: center; align-items: center; margin-top: 14px; }
.rf-acts .ink-btn { font-size: 18px; white-space: nowrap; letter-spacing: .1em; }
.rf-acts .ink-btn.primary { padding: 10px 26px 11px 24px; }
.lockline { font: 14px var(--f-kai); color: var(--zhu); margin-top: 6px; }
.link { color: var(--ink-nong); border-bottom: 1px solid var(--ink-dan); cursor: pointer; font-family: var(--f-display); font-size: 16px; }
.link:hover { color: var(--zhu); border-color: var(--zhu); }

/* ---- 弹层（设施升级 / 认主确认） ---- */
.mask { position: absolute; inset: 0; z-index: 90; background: rgba(21,24,27,.42); display: flex; align-items: center; justify-content: center; animation: inkIn .25s both; }
.dlg { width: 640px; padding: 30px 38px 26px; }
.dlg .ttl { display: flex; align-items: center; gap: 14px; }
.dlg .ttl .t { font: 400 34px var(--f-display); letter-spacing: .1em; }
.dlg .ttl .ink-seal { --s: 40px; font-size: 15px; }
.dlg .two { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 14px; }
.dlg .two .ink-h { font-size: 18px; margin-bottom: 4px; }
.dlg .two li { font: 14px/1.9 var(--f-kai); color: var(--ink-zhong); list-style: none; }
.dlg .two li.new { color: var(--ink); }
.dlg .two li.new::before { content: "新"; display: inline-block; font: 10px/15px var(--f-display); width: 15px; height: 15px; text-align: center; margin-right: 5px; color: var(--paper-hi); background: var(--zhu); -webkit-mask: var(--ink-seal-sq) 0 0 / 100% 100% no-repeat; mask: var(--ink-seal-sq) 0 0 / 100% 100% no-repeat; vertical-align: 2px; }
.dlg ul { margin: 0; padding: 0; }
.dlg .acts { display: flex; align-items: center; justify-content: flex-end; gap: 22px; margin-top: 10px; }
.dlg .cond { font: 14px var(--f-kai); margin-top: 8px; }
.dlg .cond .no { color: var(--zhu); } .dlg .cond .ok { color: #2c7d57; }
.dlg .ink-seal-btn { --s: 80px; }
.dlg .ink-seal-btn.is-disabled { background: #a9a49a; }
.toast { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 95; pointer-events: none; transition: opacity .6s; }
.cheat { position: absolute; left: 50px; bottom: 2px; z-index: 99; font: 11px var(--f-ui); color: rgba(245,240,227,.6); display: flex; gap: 10px; }
.cheat a { color: rgba(245,240,227,.85); cursor: pointer; border-bottom: 1px dotted rgba(245,240,227,.5); }
.result .acts .ink-btn { font-size: 17px; }
</style></head>
<body class="opening">
<div class="scene"></div><div class="scene-veil"></div>
<section class="ink-mount album abs" id="album"><div class="ink-mount-in"><i class="fold"></i>
  <div class="page" id="lp"></div>
  <div class="page" id="rp"></div>
</div></section>
<div id="layer"></div>
<div class="cheat">示意开关：<a data-cheat="mats">补齐材料</a><a data-cheat="move">已搬迁溪谷</a><a data-cheat="recipe">得器方《法衣》</a><a data-cheat="reset">重置</a></div>
<div class="mocktag">方向一 · 册页</div>
<script src="inkicons.classic.js"></script>
<script src="common.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const UI = { cat: "gear", rec: {}, mq: {}, rf: null, rfIdx: null, reveal: null, bind: null, result: null };
const CN = "〇一二三四五六七八九";
const S = () => FG.S;
const recs = (k) => FG.RECIPES.filter((r) => r.kind === k);
function catLocked(k) { return k === "bind" && S().forgeLv < 2; }

// 鼎的小图（左页页脚设施栏）：一笔写意，示意用
const DING = `<svg class="ding" viewBox="0 0 64 64"><path d="M14 22 Q32 18 50 22 L47 44 Q32 50 17 44 Z" fill="rgba(138,106,58,.35)"/><path d="M12 22 Q32 17 52 22" stroke="#15181b" stroke-width="3.2" fill="none" stroke-linecap="round" opacity=".85"/><path d="M14 23 L18 44 Q32 50 46 44 L50 23" stroke="#15181b" stroke-width="2.2" fill="none" opacity=".75"/><path d="M19 45 L16 57 M32 49 L32 60 M45 45 L48 57" stroke="#15181b" stroke-width="3" stroke-linecap="round" opacity=".8"/><path d="M17 20 Q16 10 22 10 M47 20 Q48 10 42 10" stroke="#15181b" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".7"/><path d="M24 32 Q32 28 40 32" stroke="#b8291a" stroke-width="2" fill="none" opacity=".8"/></svg>`;

function render() {
  renderLeft();
  renderRight();
}

// ================= 左页：目录 =================
function renderLeft() {
  const s = S();
  let h = `<div class="lp-title"><div class="t">炼器</div><div class="ink-tiba">丹器房 · 器成即见品</div></div>
  <div class="shell ink-tabs"><span class="ink-tab" data-shell>炼丹</span><span class="ink-tab on">炼器</span><span class="ink-tab" data-shell>药园</span></div>
  <div class="cats ink-tabs">${FG.CATS.map(([k, n]) => `<span class="ink-tab ${UI.cat === k ? "on" : ""} ${catLocked(k) ? "locked" : ""}" data-cat="${k}">${n}</span>`).join("")}</div>
  <div class="list">${listHTML()}</div>
  <div class="fac" data-act="fac">${DING}<div><div class="t">炼器鼎 <span class="ink-seal" style="--s:26px;font-size:12px;vertical-align:3px">${s.forgeLv === 1 ? "一阶" : "二阶"}</span></div>
    <div class="d">品质下限 ${FG.RAR[s.forgeLv - 1].name} · ${s.forgeLv >= 2 ? "已可滴血认主、极品重铸" : "二阶可滴血认主、极品重铸"}</div></div>
    <div class="go">${s.forgeLv >= 2 ? "鼎况 ›" : "升阶 ›"}<small>${s.forgeLv >= 2 ? "已至最高阶" : s.relocated ? "材料见详情" : "需搬迁溪谷灵脉"}</small></div></div>`;
  $("#lp").innerHTML = h;
}
function listHTML() {
  const s = S();
  if (UI.cat === "reforge" || UI.cat === "bind") {
    const list = UI.cat === "reforge" ? FG.reforgeables() : s.gear;
    if (!list.length) return `<div class="empty">没有带词条的装备。灵品以上的装备才有词条可重铸。</div>`;
    const cur = UI.cat === "reforge" ? UI.rf : UI.bind;
    return list.map((g) => {
      const d = FG.ITEM[g.id], na = g.affixes.filter((a) => a.stat !== "imbue").length;
      const sub = (g.worn ? "身上 · " : "仓库 · ") + `${FG.RAR[g.rarity].name} · ${CN[g.level] || g.level}级` + (UI.cat === "reforge" ? ` · 已重铸 ${g.reforged || 0} 次` : "");
      const st = UI.cat === "reforge" ? `<span class="st done">${na} 条词条</span>` : g.bound ? `<span class="st ok">已认主</span>` : catLocked("bind") ? `<span class="st lock">二阶可认</span>` : "";
      return `<div class="row ${cur === g.uid ? "on" : ""} ${catLocked(UI.cat) ? "lock" : ""}" data-g="${g.uid}">${FG.tok(g.id, { q: g.rarity, s: 46 })}<div class="nm"><b class="qt q${g.rarity}">${d.name}${g.fresh ? '<small style="display:inline;color:var(--zhu)"> 新</small>' : ""}</b><small>${sub}</small></div>${st}</div>`;
    }).join("");
  }
  const list = recs(UI.cat);
  if (!UI.rec[UI.cat] || !list.find((r) => r.id === UI.rec[UI.cat])) UI.rec[UI.cat] = (list.find((r) => FG.check(r).ok) || list[0]).id;
  return list.map((r) => {
    const c = FG.check(r);
    let st, sub, cls = "";
    if (c.ok) (st = `<span class="st ok">可炼</span>`), (sub = FG.inputs(r).map((x) => `${x.name} ${x.need}`).join(" · "));
    else if (c.lock) (st = `<span class="st lock">${c.why}</span>`), (sub = c.how || ""), (cls = "lock");
    else if (c.done) (st = `<span class="st done">${c.why}</span>`), (sub = r.kind === "upgrade" ? FG.upgradeLine(r).what + "已扩" : "");
    else (st = `<span class="st lack">缺 ${c.lack.length} 味</span>`), (sub = "缺 " + c.lack.map((x) => `${FG.name(x.id)} ${x.need - x.have}`).join(" · "));
    const q = r.kind === "gear" ? 0 : 0;
    const tk = FG.tok(FG.icon(r), { q, s: 46, cls: c.lock ? "ghost" : c.ok ? "" : "lack" });
    return `<div class="row ${UI.rec[UI.cat] === r.id ? "on" : ""} ${cls}" data-rec="${r.id}">${tk}<div class="nm"><b>${FG.rname(r)}${r.kind === "item" ? ` <small style="display:inline;font-size:12px">×${r.n}</small>` : ""}</b><small>${sub}</small></div>${st}</div>`;
  }).join("");
}

// ================= 右页：详情 + 炼制 =================
function renderRight() {
  const rp = $("#rp");
  const back = `<div class="back"><span class="ink-btn" data-act="back">回洞府 <span class="key">Esc</span></span></div>`;
  if (UI.cat === "reforge") return (rp.innerHTML = back + reforgeHTML());
  if (UI.cat === "bind") return (rp.innerHTML = back + bindHTML());
  const r = FG.RECIPES.find((x) => x.id === UI.rec[UI.cat]);
  rp.innerHTML = back + recipeHTML(r);
}
function bestQ(r) {
  const m = FG.mainOf(r), need = r.inputs[m];
  for (let q = 3; q >= 0; q--) if (FG.has(m, q) >= need) return q;
  return 0;
}
function matsHTML(r, q) {
  return FG.inputs(r, q).map((x) => {
    const ok = x.have >= x.need, s = S();
    const pin = !ok && !x.stone ? `<span class="pin ${s.pins[x.id] ? "on" : ""}" data-pin="${x.id}">${s.pins[x.id] ? "已挂念" : "挂念"}</span>` : "";
    const src = !ok && x.src.length ? `<span class="src">${x.src.join("；")}${pin}</span>` : "";
    const qq = x.q != null ? x.q : x.stone ? 0 : 0;
    return `<div class="mat ${ok ? "" : "short"}">${FG.tok(x.id, { q: qq, s: 36, cls: ok ? "" : "lack" })}<div class="body"><div class="top"><span class="nm">${x.name}${x.main ? `<small>主材 · ${FG.RAR[q].s}品</small>` : ""}</span><span class="ct"><b>${x.have}</b> / ${x.need}${ok ? '<span class="ok">足</span>' : '<span class="no">缺</span>'}</span></div>${src}</div></div>`;
  }).join("");
}
function recipeHTML(r) {
  const s = S(), c0 = FG.check(r);
  const isGear = r.kind === "gear";
  if (isGear && UI.mq[r.id] == null) UI.mq[r.id] = bestQ(r);
  const q = isGear ? UI.mq[r.id] : 0;
  const c = isGear ? FG.check(r, { q }) : c0;
  const outId = FG.icon(r), d = FG.ITEM[r.out] || {};
  const dist = isGear ? FG.dist(q) : null;
  const likely = isGear ? dist.indexOf(Math.max(...dist)) : 0;
  const slotName = { sword: "法剑", robe: "法衣", jade: "玉佩" }[d.slot];
  let sub, desc;

  if (UI.reveal && !["rf-keep", "rf-accept"].includes(t.dataset.act)) return toast("先定夺：保留原词条，还是接受新词条", "zhu");
  if (t.dataset.cat || t.dataset.rec || t.dataset.g) document.querySelectorAll(".stamp-layer").forEach((x) => (x.innerHTML = ""));
  if (t.dataset.cat) { if (catLocked(t.dataset.cat)) toast("滴血认主需二阶炼器鼎"); UI.cat = t.dataset.cat; UI.rfIdx = null; return render(); }
  if (t.dataset.rec) { UI.rec[UI.cat] = t.dataset.rec; return render(); }
  if (t.dataset.g) { UI.cat === "reforge" ? ((UI.rf = t.dataset.g), (UI.rfIdx = null)) : (UI.bind = t.dataset.g); return render(); }
  if (t.dataset.mq) { if (t.classList.contains("no")) return toast("这一档主材不够数", "zhu"); UI.mq[UI.rec.gear] = +t.dataset.mq; return renderRight(); }
  if (t.dataset.aff) { if (t.classList.contains("off")) return toast("附灵词条请走「附灵」"); UI.rfIdx = +t.dataset.aff; return renderRight(); }
  if (t.dataset.pin) { s.pins[t.dataset.pin] = !s.pins[t.dataset.pin]; toast(s.pins[t.dataset.pin] ? `已挂念 ${FG.name(t.dataset.pin)}：出行准备与天机镜会标出出处` : "不再挂念"); return renderRight(); }
  const a = t.dataset.act;
  if (a === "back") return toast("示意：回洞府");
  if (a === "fac") return facDialog();
  if (a === "close") return ($("#layer").innerHTML = "");
  if (a === "upforge") {
    if (t.classList.contains("is-disabled")) return toast(S().relocated ? "材料不足" : "需先搬迁到竹海·溪谷灵脉", "zhu");
    FG.press(t);
    const res = FG.upgradeForge();
    if (!res.ok) return toast(res.why, "zhu");
    const box = $(".dlg").getBoundingClientRect();
    FG.stamp($("#layer .mask"), box.left + box.width / 2, box.top + box.height / 2, { text: "二阶", q: 3, size: 110 });
    toast("炼器鼎升至二阶：品质下限灵品，可滴血认主", "gold");
    setTimeout(() => (($("#layer").innerHTML = ""), render()), 1300);
    return;
  }
  if (a === "craft" || a === "again") {
    const r = FG.RECIPES.find((x) => x.id === UI.rec[UI.cat]);
    const btn = $('[data-act="craft"]');
    if (a === "craft" && t.classList.contains("is-disabled")) return toast(FG.check(r, { q: UI.mq[r.id] }).why, "zhu");
    if (a === "again") $("#layer").innerHTML = "";
    const res = FG.craft(r, UI.mq[r.id] ?? 0);
    if (!res.ok) return toast(res.why, "zhu");
    if (btn) FG.press(btn);
    const host = $("#album"), tk = $("#rp > .hd .tk").getBoundingClientRect(), hb = host.getBoundingClientRect();
    const q = res.rarity || 0;
    FG.stamp(host, tk.left - hb.left + tk.width / 2, tk.top - hb.top + tk.height / 2, { text: res.gear ? FG.RAR[q].name : res.imbue ? "附灵" : "炼成", q: res.gear ? q : 0, bloom: !!res.gear, sealCls: res.gear ? undefined : "" });
    setTimeout(() => (render(), showResult(res, r)), 380);
    return;
  }
  if (a === "reforge") {
    if (t.classList.contains("is-disabled")) return toast(FG.canReforge(s.gear.find((g) => g.uid === UI.rf), UI.rfIdx).why, "zhu");
    const g = s.gear.find((x) => x.uid === UI.rf);
    const res = FG.reforgeRoll(g, UI.rfIdx);
    if (!res.ok) return toast(res.why, "zhu");
    FG.press(t);
    UI.reveal = { old: res.old, neo: res.neo, idx: UI.rfIdx };
    const host = $("#album"), tk = $("#rp > .hd .tk").getBoundingClientRect(), hb = host.getBoundingClientRect();
    FG.stamp(host, tk.left - hb.left + tk.width / 2, tk.top - hb.top + tk.height / 2, { text: "重铸", q: g.rarity, bloom: !1 });
    setTimeout(render, 300);
    return;
  }
  if (a === "rf-keep" || a === "rf-accept") {
    const g = s.gear.find((x) => x.uid === UI.rf);
    if (a === "rf-accept") { g.affixes[UI.reveal.idx] = UI.reveal.neo; const L = FG.affixLabel(UI.reveal.neo); toast(`${FG.ITEM[g.id].name}：${L.k} ${L.v}`, "gold"); }
    else toast("原词条未动；灵石已耗去");
    UI.reveal = null;
    return render();
  }
  if (a === "bind") { if (t.classList.contains("is-disabled")) return toast(S().forgeLv < 2 ? "需二阶炼器鼎" : "此器已认主或灵石不足", "zhu"); return bindConfirm(); }
  if (a === "bind-ok") { s.gear.forEach((g) => (g.bound = g.uid === UI.bind)); FG.take("spirit_stone", 100); $("#layer").innerHTML = ""; toast("认主已成：此器身陨不遗落", "gold"); return render(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#layer").innerHTML = ""; });
setTimeout(() => document.body.classList.remove("opening"), 600);

// 初始：#cat=reforge 之类直接打开分类；#fac 打开升阶弹层
const hp = new URLSearchParams(location.hash.slice(1));
if (hp.get("cat")) UI.cat = hp.get("cat");
render();
if (hp.has("fac")) facDialog();
if (hp.get("cat") === "reforge" && hp.has("reveal")) { UI.rfIdx = 0; const g = S().gear.find((x) => x.uid === UI.rf); const res = FG.reforgeRoll(g, 0); UI.reveal = { old: res.old, neo: res.neo, idx: 0 }; render(); }
window.__ready = true;
</script>
</body></html>
