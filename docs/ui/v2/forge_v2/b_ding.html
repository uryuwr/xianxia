<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const RAR = FG.RAR;
  const sel = { cat: "gear", rec: {}, q: {}, rf: null, rfIdx: null, bind: null };
  let pending = null; // 重铸待定 { uid, idx, old, neo, n }
  let pop = null; // 打开的何处可得纸条
  const h = (s) => s;

  // ---------------- 写意鼎（程序化毛笔：提按、出锋，边缘位移滤镜） ----------------
  function spline(pts, N) {
    const p = [pts[0], ...pts, pts[pts.length - 1]], out = [];
    for (let i = 1; i < p.length - 2; i++)
      for (let k = 0; k < N; k++) {
        const t = k / N, t2 = t * t, t3 = t2 * t, [a, b, c, d] = [p[i - 1], p[i], p[i + 1], p[i + 2]];
        out.push([0, 1].map((j) => 0.5 * (2 * b[j] + (-a[j] + c[j]) * t + (2 * a[j] - 5 * b[j] + 4 * c[j] - d[j]) * t2 + (-a[j] + 3 * b[j] - 3 * c[j] + d[j]) * t3)));
      }
    out.push(pts[pts.length - 1]);
    return out;
  }
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  function brush(pts, w, o = {}) {
    const C = spline(pts, 10), n = C.length - 1, L = [], R = [];
    const head = o.head ?? 0.1, taper = o.taper ?? 0.35, press = o.press ?? 1.25, tail = o.tail ?? 0.05;
    const wob = Array.from({ length: 6 }, () => rnd() * 2 - 1);
    for (let i = 0; i <= n; i++) {
      const t = i / n, a = C[Math.max(0, i - 1)], b = C[Math.min(n, i + 1)];
      const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1, nx = -dy / d, ny = dx / d;
      let p = 1 + 0.12 * wob[Math.floor(t * 5.99)];
      if (t < head) p *= 0.55 + 0.45 * (t / head) * press;
      else if (t < head * 2) p *= press - (press - 1) * ((t - head) / head);
      if (t > 1 - taper) p *= Math.max(tail, 1 - Math.pow((t - (1 - taper)) / taper, 1.2));
      const hw = (w / 2) * p;
      L.push([C[i][0] + nx * hw, C[i][1] + ny * hw]);
      R.push([C[i][0] - nx * hw, C[i][1] - ny * hw]);
    }
    const P = [...L, ...R.reverse()];
    return `<path d="M${P.map((q) => q[0].toFixed(1) + " " + q[1].toFixed(1)).join("L")}Z" fill="${o.c || "#15181b"}" opacity="${o.op ?? 0.85}" ${o.f ? `filter="url(#${o.f})"` : ""}/>`;
  }
  function drawDing() {
    seed = 11;
    const W = (pts, c, op, f = "dbleed") => `<path d="M${pts.map((q) => q.join(" ")).join("L")}Z" fill="${c}" opacity="${op}" filter="url(#${f})"/>`;
    let s = `<defs>
      <filter id="drough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
      <filter id="dbleed" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="3" seed="2"/><feDisplacementMap in="SourceGraphic" scale="12"/><feGaussianBlur stdDeviation="3"/></filter>
      <linearGradient id="dbody" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#3a4a52" stop-opacity=".30"/><stop offset=".5" stop-color="#15181b" stop-opacity=".10"/><stop offset="1" stop-color="#15181b" stop-opacity=".34"/></linearGradient>
    </defs>`;
    // 地面淡影
    s += `<ellipse cx="165" cy="292" rx="140" ry="14" fill="#15181b" opacity=".10" filter="url(#dbleed)"/>`;
    // 鼎身没骨（淡墨 + 青铜黛色）
    s += W([[40, 106], [290, 106], [282, 160], [262, 205], [228, 232], [165, 242], [102, 232], [68, 205], [48, 160]], "url(#dbody)", 1);
    s += W([[60, 120], [120, 128], [110, 200], [84, 196]], "#15181b", 0.12);
    s += W([[230, 128], [278, 122], [262, 190], [238, 210]], "#8a6a3a", 0.16);
    // 足（三足，粗笔，起笔重、收笔出锋）
    s += brush([[98, 222], [90, 244], [80, 266], [64, 284]], 20, { taper: 0.6, press: 1.35, op: 0.8, f: "drough" });
    s += brush([[60, 286], [74, 288]], 9, { taper: 0.5, op: 0.6 });
    s += brush([[165, 240], [163, 262], [158, 284], [150, 298]], 20, { taper: 0.6, press: 1.35, op: 0.86, f: "drough" });
    s += brush([[146, 300], [160, 301]], 9, { taper: 0.5, op: 0.6 });

  // ---------------- 工具 ----------------
  function toast(t, c = "") {
    const e = document.createElement("div");
    e.className = "ink-toast " + c;
    e.textContent = t;
    $("toasts").appendChild(e);
    setTimeout(() => (e.style.transition = "opacity .6s", (e.style.opacity = 0)), 2200);
    setTimeout(() => e.remove(), 2900);
  }
  const S = () => FG.S;
  const qOK = (r, q) => FG.has(FG.mainOf(r), q) >= r.inputs[FG.mainOf(r)];
  function defaultQ(r) {
    const id = FG.mainOf(r), need = r.inputs[id];
    for (let q = 3; q >= 0; q--) if (FG.has(id, q) >= need) return q;
    for (let q = 3; q >= 0; q--) if (FG.has(id, q) > 0) return q;
    return 0;
  }
  const curQ = (r) => (r.kind === "gear" ? sel.q[r.id] ?? (sel.q[r.id] = defaultQ(r)) : null);
  function status(r) {
    const c = FG.check(r, { q: r.kind === "gear" ? curQ(r) : undefined });
    if (c.ok) return { t: "可炼", cls: "ok", c };
    if (c.done) return { t: c.why, cls: "", c, dim: !0 };
    if (c.lock) return { t: c.why + (c.how ? " · " + c.how.replace(/^.*· /, "") : ""), cls: "", c, dim: !0 };
    const lk = c.lack.map((x) => FG.name(x.id));
    return { t: `缺 ${lk.length} 味 · ${lk.slice(0, 2).join("、")}`, cls: "no", c };
  }
  const gname = (g) => FG.name(g.id);

  // ---------------- 左：分类 + 目录 ----------------
  function renderCats() {
    $("cats").innerHTML = FG.CATS.map(([k, n]) => `<span class="ink-vtab ${sel.cat === k ? "on" : ""}" data-cat="${k}">${n}</span>`).join("");
  }
  function listItems() {

    if (c === "bind") return S().gear.map((g) => ({ id: g.uid, icon: g.id, q: g.rarity, nm: gname(g), st: g.bound ? "已认主" : (g.worn ? "身上 · " : "仓库 · ") + RAR[g.rarity].name, cls: g.bound ? "no" : "" }));
    return FG.RECIPES.filter((r) => r.kind === c).map((r) => {

    });
  }
  function selId() {
    const c = sel.cat, items = listItems();
    if (c === "reforge") { if (!items.find((x) => x.id === sel.rf)) sel.rf = (items[0] || {}).id; return sel.rf; }
    if (c === "bind") { if (!items.find((x) => x.id === sel.bind)) sel.bind = (items.find((x) => S().gear.find((g) => g.uid === x.id).worn) || items[0] || {}).id; return sel.bind; }
    if (!items.find((x) => x.id === sel.rec[c])) sel.rec[c] = (items.find((x) => x.cls === "ok") || items[0]).id;

  function renderList() {
    const items = listItems(), cur = selId();
    const capt = { gear: "装备 · 炼成即已鉴定", item: "符箓 · 一炉数张", upgrade: "扩容 · 储物袋 / 锦囊 / 丹药囊", imbue: "附灵 · 给身上法剑", reforge: "重铸 · 灵品以上、带词条的装备", bind: "认主 · 身陨不遗落，只能一件" }[sel.cat];

  // ---------------- 中：鼎周围的材料 ----------------
  // 位置（相对 #ding 520×604）：主位在鼎口上方，辅材左右两侧，灵石在鼎下
  const POS = { top: [260, 92], l1: [70, 270], r1: [450, 270], l2: [92, 420], r2: [428, 420], bottom: [260, 530] };
  const MOUTH = [260, 250];
  function matsFor() {
    const c = sel.cat, id = selId(), out = [];

      const g = S().gear.find((x) => x.uid === id);
      if (!g) return out;

      if (c === "reforge") {

    const r = FG.RECIPES.find((x) => x.id === id);

    }
    const side = ["l1", "r1", "l2", "r2"];
    for (const x of ins) {
      if (x.stone) { out.push({ pos: "bottom", id: x.id, icon: x.id, q: 0, have: x.have, need: x.need, s: 50 }); continue; }
      const pos = !out.some((o) => o.pos === "top") ? "top" : side[k++];
      out.push({ pos, id: x.id, icon: x.id, q: x.q ?? 0, have: x.have, need: x.need, main: x.main, s: pos === "top" ? 80 : 60 });

  function renderMats() {

  function bindCard(g) {
    const lv = S().forgeLv, bound = S().gear.find((x) => x.bound);
    let s = `<div class="head"><span class="ink-seal" style="--s:54px;font-size:22px">血</span><div><div class="nm">滴血认主</div><div class="sub">永久护住一件装备 · 只能一件</div></div></div>`;
    s += `<div class="desc">以精血祭炼，此器从此与你性命相连：身陨不遗落。改认他物，原先那件便解除。</div>`;
    if (lv < 2) return s + `<div class="lockbox"><div class="why">需二阶炼器鼎</div><div class="how">炼器鼎升二阶要先搬迁到竹海·溪谷灵脉。<br><span class="go-up" style="cursor:pointer;color:var(--ink-nong);border-bottom:1px dashed var(--ink-dan)">去看升阶 ›</span></div></div>`;
    if (g) s += `<div class="sec">选中</div><div class="tgt">${FG.tok(g.id, { q: g.rarity, s: 40 })}<b style="color:var(--r${g.rarity}t)">${RAR[g.rarity].name} ${gname(g)}${g.bound ? "（已认主）" : ""}</b></div>`;
    s += `<div class="cardrow"><span>现认主</span><b>${bound ? gname(bound) : "无"}</b></div>`;
    s += `<div class="cardrow"><span>代价</span><b>灵石 100 · 下局气血上限 −10%</b></div>`;
    return s;
  }
  function renderCard() {
    const c = sel.cat, id = selId();
    let s = "";
    if (c === "reforge") s = reforgeCard(S().gear.find((g) => g.uid === id));
    else if (c === "bind") s = bindCard(S().gear.find((g) => g.uid === id));
    else {
      const r = FG.RECIPES.find((x) => x.id === id);
      s = { gear: gearCard, item: itemCard, upgrade: upgradeCard, imbue: imbueCard }[c](r);
    }
    $("card").innerHTML = '<i class="ink-sheet" aria-hidden="true"></i>' + s;
  }

  // ---------------- 右下：决断印 ----------------
  function actState() {
    const c = sel.cat, id = selId();
    if (c === "reforge") {
      const g = S().gear.find((x) => x.uid === id);
      if (!g) return { ok: !1, t: "重铸", why: "没有可重铸的装备" };
      if (pending) return { ok: !1, t: "重铸", why: "先定夺这一掷" };
      const k = FG.canReforge(g, sel.rfIdx);
      return { ok: k.ok, t: "重铸", why: k.ok ? "可重铸" : k.why };
    }
    if (c === "bind") {
      const g = S().gear.find((x) => x.uid === id);
      if (S().forgeLv < 2) return { ok: !1, t: "认主", why: "需二阶炼器鼎" };
      if (!g) return { ok: !1, t: "认主", why: "没有装备" };
      if (g.bound) return { ok: !1, t: "认主", why: "此件已认主" };
      if (FG.has("spirit_stone") < 100) return { ok: !1, t: "认主", why: "灵石不足（需 100）" };
      return { ok: !0, t: "认主", why: "可认主" };
    }
    const r = FG.RECIPES.find((x) => x.id === id), st = status(r);
    return { ok: st.c.ok, t: r.kind === "imbue" ? "附灵" : "炼制", why: st.c.ok ? "可炼" : st.c.lack ? `缺 ${st.c.lack.length} 味` : st.c.why, sub: st.c.lack ? "点鼎边朱圈看何处可得" : st.c.lock ? "" : "" };
  }
  function renderAct() {
    const a = actState();
    $("act").innerHTML = `<div class="why"><b class="${a.ok ? "" : "no"}">${a.why}</b>${a.sub || (a.ok ? '<span class="key" style="margin:0">Space</span> 落印' : "")}</div><button class="ink-seal-btn ${a.ok ? "" : "is-disabled"}" id="go">${a.t}</button>`;
  }

  function renderPins() {
    const ids = Object.keys(S().pins).filter((k) => S().pins[k]);
    $("pins").innerHTML = `<div class="t">挂念<small>出行准备与天机镜会标出</small></div>` + (ids.length ? `<div class="ls">${ids.map((id) => FG.tok(id, { s: 36, n: FG.has(id) })).join("")}</div>` : `<div class="e">点鼎边缺料的朱圈，可把它记作挂念。</div>`);
  }
  function render() {
    renderPins();
    renderCats(); renderList(); renderMats(); renderCard(); renderAct();
    $("stoneN").textContent = FG.has("spirit_stone");
  }

  // ---------------- 动作 ----------------
  const fx = (html) => { $("fx").insertAdjacentHTML("beforeend", html); return $("fx").lastElementChild; };
  function closeFx() { $("fx").innerHTML = ""; }
  function clearStamp() { const L = $("ding").querySelector(".stamp-layer"); if (L) L.innerHTML = ""; }
  function busy() { $("ding").classList.add("busy"); setTimeout(() => $("ding").classList.remove("busy"), 2000); }
  function doGo() {
    const a = actState();
    if (!a.ok) return toast(a.why, "zhu");
    FG.press($("go"));
    const c = sel.cat, id = selId();
    closeFx(); busy();
    if (c === "reforge") {
      const g = S().gear.find((x) => x.uid === id), idx = sel.rfIdx;
      const res = FG.reforgeRoll(g, idx);
      if (!res.ok) return toast(res.why, "zhu");
      pending = { uid: g.uid, idx, old: res.old, neo: res.neo, n: g.reforged };
      FG.stamp($("ding"), 260, 205, { q: g.rarity, text: "重铸", size: 84 });
      render(); showReveal(g);
      return;
    }
    if (c === "bind") return confirmBind(S().gear.find((x) => x.uid === id));
    const r = FG.RECIPES.find((x) => x.id === id);
    const res = FG.craft(r, curQ(r));
    if (!res.ok) return toast(res.why, "zhu");
    const q = res.rarity || 0;
    FG.stamp($("ding"), 260, 205, { q, text: r.kind === "gear" ? RAR[q].name : r.kind === "imbue" ? "附灵" : "炼成", size: 92 });
    if (r.kind === "gear" && FG.has(FG.mainOf(r), curQ(r)) < r.inputs[FG.mainOf(r)]) sel.q[r.id] = defaultQ(r);
    render(); showResult(r, res);
  }
  function showResult(r, res) {
    let body = "";
    if (res.gear) {
      const g = res.gear, d = FG.ITEM[g.id];
      body = `<div class="hd">${FG.tok(g.id, { q: g.rarity, s: 58 })}<div><div class="nm" style="color:var(--r${g.rarity}t)">${RAR[g.rarity].name} ${d.name}</div><div class="sub">已鉴定 · ${g.level} 级${res.up ? " · <span style='color:var(--zhu)'>鼎中再升一品</span>" : ""}</div></div></div><div style="margin-top:8px">`;
      for (const b of FG.baseStats(g.id, g.level, g.rarity)) body += `<div class="ln"><span>${FG.STAT[b.stat]}</span><b>${FG.fmt(b.stat, b.v).replace("+", "")}</b></div>`;
      if (g.affixes.length) body += `<div class="lab2">词 条</div>`;
      for (const a of g.affixes) { const L = FG.affixLabel(a); body += `<div class="ln af q${g.rarity}"><span>${L.k}</span><b>${L.v}</b></div>`; }
      body += `</div>`;
    } else if (res.item) body = `<div class="hd">${FG.tok(res.item, { s: 58 })}<div><div class="nm">${FG.name(res.item)} ×${res.n}</div><div class="sub">已收入仓库 · 现有 ${FG.has(res.item)} 张</div></div></div>`;
    else if (res.upgrade) { const u = FG.upgradeLine(r); body = `<div class="hd">${FG.tok(r.icon, { s: 58 })}<div><div class="nm">${r.name}</div><div class="sub">${u.what}已扩至 ${res.upgrade === "pillCap" ? S().pillCap + " 枚 / 栏" : r.value + " 格"}</div></div></div>`; }
    else if (res.imbue) { const sw = FG.worn("sword"); body = `<div class="hd">${FG.tok(sw.id, { q: sw.rarity, s: 58 })}<div><div class="nm" style="color:var(--r${sw.rarity}t)">${gname(sw)}</div><div class="sub">附灵 · ${FG.EL[res.imbue]}${res.old && res.old !== res.imbue ? `（原「${FG.EL[res.old]}」已散）` : ""}</div></div></div>`; }
    const el = fx(`<section class="ink-paper result ${res.gear && res.gear.rarity >= 3 ? "sajin" : ""}">${body}<div class="acts"><span class="ink-btn" data-x="close">收下</span></div></section>`);
    inkui.decorate(el.parentNode);
    toast(res.gear ? `炼成 ${RAR[res.gear.rarity].name}${FG.ITEM[res.gear.id].name}` : res.item ? `炼成 ${FG.name(res.item)} ×${res.n}` : res.upgrade ? "扩容已成" : "附灵已成", "gold");
  }
  function showReveal(g) {
    const P = pending, o = FG.affixLabel(P.old), n = FG.affixLabel(P.neo);
    const el = fx(`<section class="ink-paper alt reveal"><div class="t">重铸 · 第 ${P.n} 次<small>花费已付，不退</small></div>
      <div class="rf-cmp q${g.rarity}"><div class="side old"><small>原词条</small><b>${o.k}<br>${o.v}</b></div><div class="arr">→</div><div class="side neo q${g.rarity}"><small>新掷出</small><b>${n.k}<br>${n.v}</b></div></div>
      <div class="acts"><span class="ink-btn" data-x="keep">保留原词条</span><span class="ink-btn primary" data-x="accept">接受新词条</span></div></section>`);
    inkui.decorate(el.parentNode);
  }
  function confirmBind(g) {
    const bound = S().gear.find((x) => x.bound);
    const el = fx(`<div class="mask"><section class="ink-paper alt modal" style="width:480px"><h3>滴血认主</h3>
      <p style="font:15px/1.8 var(--f-kai);color:var(--ink-nong);margin:14px 0 4px">以精血祭炼「<b style="color:var(--r${g.rarity}t);font-family:var(--f-display)">${RAR[g.rarity].name}${gname(g)}</b>」？</p>
      <p style="font:13px/1.8 var(--f-kai);color:var(--ink-zhong);margin:0">灵石 100；<span style="color:var(--zhu)">下一局气血上限 −10%</span>。${bound ? `原认主的「${gname(bound)}」将解除。` : ""}</p>
      <div class="foot"><span class="ink-btn" data-x="mclose">罢了</span><button class="ink-seal-btn" data-x="dobind">认主</button></div></section></div>`);
    inkui.decorate(el);
  }
  function showUpgrade() {
    const lv = S().forgeLv, F = FG.FORGE_FAC, cost = F.cost[lv], nx = F.effect[lv + 1];
    let s = `<div class="mask"><section class="ink-paper alt modal"><h3>炼器鼎<span class="ink-seal ${lv >= 2 ? "gold" : ""}" style="--s:34px;font-size:14px">${F.lv[lv].slice(0, 1)}<br>阶</span><small style="font:13px var(--f-ui);color:var(--ink-dan);margin-left:auto;letter-spacing:0">设施 · 与器方无关</small></h3>`;
    if (!cost) {
      s += `<div class="cols" style="grid-template-columns:1fr"><div class="col nx"><div class="lv">二阶 · 已至顶</div>${F.effect[lv].map((t) => `<p>${t}</p>`).join("")}</div></div><div class="foot"><span class="ink-btn" data-x="mclose">合上</span></div></section></div>`;
    } else {
      s += `<div class="cols"><div class="col cur"><div class="lv">${F.lv[lv]} · 现</div>${F.effect[lv].map((t) => `<p>${t}</p>`).join("")}</div><div class="arr">→</div><div class="col nx"><div class="lv">${F.lv[lv + 1]}</div>${nx.map((t) => `<p class="new">${t}</p>`).join("")}</div></div>`;
      s += `<div class="sec" style="font:400 17px var(--f-display);letter-spacing:.1em;color:var(--ink-nong);margin:10px 0 4px">升阶所需</div><div class="mats">`;
      const rows = [["spirit_stone", cost.stones], ...Object.entries(cost.items)];
      for (const [id, n] of rows) {
        const hv = FG.has(id), ok = hv >= n, src = (FG.ITEM[id] || {}).src || [];
        s += `<div class="mat ${ok ? "" : "short"}">${FG.tok(id, { s: 40, cls: ok ? "" : "lack" })}<div><span class="nm">${FG.name(id)}</span>${ok ? "" : `<span class="src">${src[0] || ""}</span>`}</div><span class="ct"><b>${hv}</b> / ${n}<span class="${ok ? "ok" : "no"}">${ok ? "足" : "缺"}</span></span></div>`;
      }
      s += `</div>`;
      if (cost.relocate) s += `<div class="cond ${S().relocated ? "ok" : "no"}">${S().relocated ? "✓ 洞府已搬迁到竹海·溪谷灵脉" : "✗ 需先搬迁到竹海·溪谷灵脉（练气五层后可往）"}</div>`;
      const ok = !(cost.relocate && !S().relocated) && FG.has("spirit_stone") >= cost.stones && Object.entries(cost.items).every(([id, n]) => FG.has(id) >= n);
      s += `<div class="foot"><span class="ink-btn" data-x="mclose">罢了</span><button class="ink-seal-btn ${ok ? "" : "is-disabled"}" data-x="doup">升阶</button></div></section></div>`;
    }
    const el = fx(s);
    inkui.decorate(el);
  }
  function showPop(m, id) {
    closePop();
    const it = FG.ITEM[id] || {}, need = (matsFor().find((x) => x.id === id) || {}).need, hv = (matsFor().find((x) => x.id === id) || {}).have;
    const r = m.getBoundingClientRect();
    const left = r.left < 640 ? r.right + 4 : r.left - 244, top = Math.min(560, Math.max(90, r.top - 10));
    const pinned = S().pins[id];
    const el = document.createElement("section");
    el.className = "ink-tip pop";
    el.style.left = left + "px"; el.style.top = top + "px";
    el.innerHTML = `<div class="h"><b>${it.name || id}</b><small>有 ${hv} / 需 ${need}${hv < need ? ` <i>差 ${need - hv}</i>` : ""}</small></div><div class="lab">何 处 可 得</div>${(it.src || ["—"]).map((x) => `<div class="s">${x}</div>`).join("")}
      <div class="ft"><span>${id === "spirit_stone" ? "" : "挂念后，出行准备与天机镜会标出它"}</span>${id === "spirit_stone" ? "" : `<span class="pin ${pinned ? "on" : ""}" data-pin="${id}">${pinned ? "已挂念" : "挂念"}</span>`}</div>`;
    document.body.appendChild(el);
    inkui.decorate(document.body);
    pop = el;
  }
  function closePop() { if (pop) pop.remove(), (pop = null); }

  // ---------------- 事件 ----------------
  document.addEventListener("click", (e) => {
    const t = e.target;
    const x = t.closest("[data-x]");
    if (x) {
      const k = x.dataset.x;
      if (k === "close") closeFx();
      if (k === "keep" || k === "accept") {
        const g = S().gear.find((y) => y.uid === pending.uid);
        if (k === "accept") g.affixes[pending.idx] = pending.neo, toast(`${gname(g)}：${FG.affixLabel(pending.neo).k} ${FG.affixLabel(pending.neo).v}`, "gold");
        else toast("原词条未动；灵石已耗去");
        pending = null; closeFx(); render();
      }
      if (k === "mclose") closeFx();
      if (k === "doup") {
        if (x.classList.contains("is-disabled")) return toast("条件未齐", "zhu");
        FG.press(x);
        const r = FG.upgradeForge();
        if (!r.ok) return toast(r.why, "zhu");
        closeFx(); render();
        FG.stamp($("ding"), 260, 205, { q: 3, text: "二阶", size: 92, bloom: !0 });
        toast("炼器鼎升至二阶 · 认主已开 · 品质下限灵品", "gold");
      }
      if (k === "dobind") {
        const g = S().gear.find((y) => y.uid === selId());
        S().gear.forEach((y) => (y.bound = !1));
        g.bound = !0; FG.take("spirit_stone", 100);
        closeFx(); render();
        FG.stamp($("ding"), 260, 205, { q: 4, text: "认主", size: 92 });
        toast(`「${gname(g)}」已认主`, "gold");
      }
      return;
    }
    if (pop && !t.closest(".pop") && !t.closest("[data-mat]")) closePop();
    const pin = t.closest("[data-pin]");
    if (pin) { const id = pin.dataset.pin; S().pins[id] = !S().pins[id]; pin.classList.toggle("on"); pin.textContent = S().pins[id] ? "已挂念" : "挂念"; renderPins(); toast(S().pins[id] ? `已挂念 ${FG.name(id)}：出行时留意` : `不再挂念 ${FG.name(id)}`); return; }
    const cat = t.closest("[data-cat]");
    if (cat) { if (pending) return toast("先定夺这一掷", "zhu"); sel.cat = cat.dataset.cat; sel.rfIdx = null; closeFx(); closePop(); clearStamp(); return render(); }
    const row = t.closest(".row[data-id]");
    if (row) {
      if (pending) return toast("先定夺这一掷", "zhu");
      const id = row.dataset.id;
      if (sel.cat === "reforge") (sel.rf = id), (sel.rfIdx = null); else if (sel.cat === "bind") sel.bind = id; else sel.rec[sel.cat] = id;
      closeFx(); closePop(); clearStamp(); return render();
    }
    const mt = t.closest("[data-mat]");
    if (mt) return showPop(mt, mt.dataset.mat);
    const qp = t.closest(".qpick > div[data-q]");
    if (qp) {
      const r = FG.RECIPES.find((x) => x.id === selId()), q = +qp.dataset.q;
      if (FG.has(FG.mainOf(r), q) < r.inputs[FG.mainOf(r)]) toast(`${RAR[q].name}${FG.name(FG.mainOf(r))}不够 ${r.inputs[FG.mainOf(r)]} 份`, "zhu");
      sel.q[r.id] = q; return render();
    }
    const af = t.closest(".rf-row[data-aff]");
    if (af) {
      if (pending) return;
      const g = S().gear.find((x) => x.uid === selId()), a = g.affixes[+af.dataset.aff];
      if (a.stat === "imbue") return toast("附灵词条不能重铸，请走「附灵」", "zhu");
      sel.rfIdx = +af.dataset.aff; return render();
    }
    if (t.closest("#go")) return doGo();
    if (t.closest("#ming") || t.closest(".go-up")) return showUpgrade();
    const tab = t.closest("[data-tab]");
    if (tab) return toast("示意图只做炼器页；炼丹、药园沿用同一外壳");
    if (t.closest("#back")) return toast("回洞府（示意）");
    const ch = t.closest("[data-c]");
    if (ch) {
      const k = ch.dataset.c;
      if (k === "reset") FG.reset(), (pending = null), (sel.q = {}), closeFx();
      else FG.cheat(k), (sel.q = {});
      toast({ mats: "材料已补齐（灵品）", move: "洞府已搬迁到竹海·溪谷", recipe: "得器方《法衣》", reset: "示意数据已重置" }[k]);
      return render();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") e.preventDefault(), doGo();
    if (e.key === "Escape") closeFx(), closePop();
  });

  // ---------------- 启动 ----------------
  const hm = /cat=(\w+)/.exec(location.hash);
  if (hm && FG.CATS.some(([k]) => k === hm[1])) sel.cat = hm[1];
  if (/rfidx=(\d)/.test(location.hash)) sel.rfIdx = +/rfidx=(\d)/.exec(location.hash)[1];
  drawDing();
  render();
  inkui.decorate();
  setTimeout(() => document.body.classList.remove("opening"), 600);
  window.__ready = true;
})();
</script>
</body></html>
