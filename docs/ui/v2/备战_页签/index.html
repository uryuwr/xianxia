 $('xinfasum').textContent=`心法 · ${state.xinfa.map(id=>xinfalist.find(x=>x.id===id)?.name||id).join(' / ')}　阵法 · ${FORMATIONS[state.formation]?.name||'聚灵阵'}`;
 const n=pack.reduce((s,p)=>s+p.n,0);$('status').textContent=`${state.mode==='inner'?'预案已记 · 不扣仓库':'待启程 · '}${n} 枚入囊 · 委托 ${state.quests.size}/2`;
 $('context').innerHTML=`${state.mode==='prep'?`<span>去处 <select id="region" aria-label="出行去处"><option value="r1" ${state.region==='r1'?'selected':''}>青岚山外</option><option value="r2" ${state.region==='r2'?'selected':''}>竹海·溪谷</option></select></span><span class="dim">${state.region==='r2'?'高风险 · 未认主法器可能遗落':'低风险 · 量力而归'}</span><button class="red" id="gap">${state.spells.some(id=>SPELLS[id]?.element==='water')?'护盾缺口已补':'缺水 · 查看来源 ›'}</button>`:'<span class="dim">洞府中整装，不消耗仓库物品；出行台沿用同一份预案。</span>'}<button class="ready" id="ready">掌心雷 · 残页已齐 · 去仓库参悟 ›</button>`;
 $('bottomnote').textContent='';$('pager').innerHTML='';
 if(state.tab==='pack')renderPack();if(state.tab==='skill')renderSkills();if(state.tab==='gear')renderGear();if(state.tab==='quest')renderQuests();
}
function renderPack(){
 $('subhead').innerHTML=[['all','全部'],['pill','丹药'],['fu','符箓'],['pre','出发前服用'],['pouch','贴身锦囊']].map(([id,n])=>subbutton(id,n)).join('')+'<small class="right">丹药 2 种 · 每种 3 枚（各品级合计）</small>';
 if(state.sub==='pouch'){$('content').innerHTML=`<div class="empty"><div>${ico('jinnang_qiankun',72)}<h2>贴身锦囊</h2><p>关键小件与护身之物，身陨亦不遗失。</p><button class="small-primary" data-note="草图：从仓库选择锦囊物品，不改变真实存档。">选择放入</button></div></div>`;return}
 const list=state.full?pack.filter(p=>state.sub==='all'||p.cat===state.sub):[];
 const shown=pageList(list,9);$('content').innerHTML=shown.length?`<div class="grid">${shown.map(p=>{const i=pack.indexOf(p);return `<article class="item" style="--q:${inkReadable(p.q)}"><div class="ring">${ico(p.id)}</div><div class="body"><h3>${p.name}<span class="q"> · ${RARITY[p.q].name[0]}</span></h3><small>${p.desc}</small><div class="amount"><button class="round" data-count="${i}" data-delta="-1" aria-label="少带一枚${p.name}${RARITY[p.q].name}" ${p.n?'':'disabled'}>−</button><b>${p.n}</b><button class="round" data-count="${i}" data-delta="1" aria-label="多带一枚${p.name}${RARITY[p.q].name}" ${p.n>=p.have?'disabled':''}>＋</button><span class="stock">有 ${p.have}</span></div></div></article>`}).join('')}</div>`:'<div class="empty"><div><h2>行囊尚轻</h2><p>仓库没有可带之物。可先轻装出行，或回仓库整理。</p></div></div>';
 $('bottomnote').textContent='每格一种品级；翻页不会丢失已选数量。符箓每种至多 3 张，出发前丹药每种 1 枚。';
}
function renderSkills(){
 if(!['spell','xinfa','formation'].includes(state.sub))state.sub='spell';
 $('subhead').innerHTML=[['spell','法术'],['xinfa','心法'],['formation','阵法']].map(([id,n])=>subbutton(id,n)).join('')+'<small class="right">点击看来源 / 装配 · 每页六门</small>';
 const list=state.sub==='spell'?Object.values(SPELLS):state.sub==='xinfa'?xinfalist:Object.values(FORMATIONS);
 const shown=pageList(list,6);let d=list.find(x=>x.id===state.selected)||shown[0];if(!d)d=list[0];state.selected=d?.id;
 const spell=state.sub==='spell',have=!spell||known.has(d?.id),src=sources[d?.id]||['所得功法','已领悟',1,1];
 $('content').innerHTML=`<div class="skills"><div class="skill-grid">${shown.map(x=>{const learned=!spell||known.has(x.id),s=sources[x.id]||['已领悟','',1,1];return `<button class="skill ${learned?'':'unknown'} ${state.selected===x.id?'selected':''}" data-skill="${x.id}">${ico('sk:'+x.id,44)}<div><h3>${esc(x.name)}${spell&&x.element==='water'?'<span class="tag">补水</span>':''}</h3><p>${learned?'已领悟 · '+(x.role||'可装配'):s[0]}<br>${learned?(state.spells.includes(x.id)?'当前已带':'点击查看'):s[2]+'/'+s[3]+' · '+(s[2]>=s[3]?'可参悟':'残页')}</p></div></button>`}).join('')}</div><aside class="detail"><h2>${esc(d?.name||'功法')}</h2><small>${spell?({metal:'金',wood:'木',water:'水',fire:'火',earth:'土'}[d.element]||'')+' · '+(d.role||'法术'):'心法与阵法'}${have?' · 已领悟':' · 尚未领悟'}</small><p>${esc((d?.desc||'装配后生效。完整效果见详细说明。').slice(0,36))}</p><div class="sources">${spell?src[0]+'<br>'+src[1]:'装配所得功法，随行生效。'}</div>${spell&&!have?`<div class="dots">${Array.from({length:src[3]},(_,i)=>`<i class="${i<src[2]?'fill':''}"></i>`).join('')}<span>${src[2]} / ${src[3]}</span></div><small>集齐后回洞府仓库参悟</small>`:''}<div class="acts">${have?`<button class="small-primary" id="equipSkill">${spell?'装入 R 栏':'装配'}</button>`:`<button class="small-primary" id="track">${state.map?'已标在舆图':'标在舆图'}</button>`}<button id="long">详细说明 ›</button></div></aside></div>`;
 $('bottomnote').textContent=spell?'来源与装配分开：未领悟只能查看 / 追踪，不会误装入法术栏。':'示意数据 · 分类与分页共用，不新建功法谱应用。';
}
function renderGear(){
 $('subhead').innerHTML='<span class="display" style="font-size:20px">法器架</span><small>点选佩戴，左侧随身摘要同步</small><small class="right">品级沿用游戏 RARITY</small>';
 const list=state.full?gears:[];const shown=pageList(list,6);$('content').innerHTML=`<div class="gear-grid">${shown.map(([id,n,q,desc])=>`<button class="gear-card" data-gear="${id}" style="--q:${inkReadable(q)}"><div class="ring">${ico(id)}</div><h3>${n}</h3><small>${RARITY[q].name} · ${id.includes('sword')?'法剑':id.includes('robe')?'法衣':id.includes('jade')?'玉佩':'法宝'}</small><p>${desc}</p><span class="wear">${state.gear===id?'已佩戴':'查看 / 佩戴 ›'}</span></button>`).join('')}</div>`;
 if(!shown.length)$('content').innerHTML='<div class="empty"><div><h2>法器架空着</h2><p>已佩戴的法器仍在左侧，换页不会隐藏当前装配。</p></div></div>';
 $('bottomnote').textContent='这里只示意换装交互，不修改实际战斗属性。';
}
function renderQuests(){
 $('subhead').innerHTML=`<span class="display" style="font-size:20px">${state.mode==='inner'?'委托预览':'本次随行'}</span><small>${state.mode==='inner'?'洞府中可先查看，前往出行台接取':'最多接取两个；启程时确认'}</small><span class="right small">已选 ${state.quests.size} / 2</span>`;
 $('content').innerHTML=`<div class="quest-grid">${quests.map(([name,desc,reward],i)=>`<article class="quest-card ${state.quests.has(i)?'selected':''}"><small>委托 · ${['采集','寻物','斩妖'][i]}</small><h2>${name}</h2><p>${desc}</p><p class="reward">报酬<br>${reward}</p><button data-quest="${i}" ${state.mode==='inner'?'disabled':''}>${state.mode==='inner'?'出行台可接取':state.quests.has(i)?'已选 · 撤下':'接下此托 ›'}</button></article>`).join('')}</div>`;
 $('bottomnote').textContent='委托完整铺在案上，一次看清三个，不再挤在行囊下方。';
}
function openModal(title,html){focusBefore=document.activeElement;$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('overlay').hidden=false;$('closeModal').focus()}
function closeModal(){$('overlay').hidden=true;focusBefore?.focus()}
function longDescription(){const d=SPELLS[state.selected]||xinfalist.find(x=>x.id===state.selected)||FORMATIONS[state.selected];const src=sources[state.selected];openModal((d?.name||'功法')+' · 详录',`<div class="readbox"><div class="reader" id="reader" tabindex="0" aria-label="功法长说明，可用方向键及翻页键滚动"><h3>功法要义</h3><p>${esc(d?.desc||'修习此法，随身装配后生效。')}</p><h3>装配与取舍</h3><p>本册的法术、心法与阵法分别归类。装配只改变对应栏位，切换页签与翻页会保留已有选择。此处为交互草图，效果文字可展开查看，不影响左侧当前装配与主操作的位置。</p><h3>来源与参悟</h3><p>${src?src[0]+' · '+src[1]:'已有功法可直接装配。'}。残页带回洞府后在仓库参悟；足够的悟性可以补齐缺页，但须先取得至少一页实物。得到完本时，应显示完本已得，而不是误写成一页残页。</p><h3>野外指引</h3><p>已批准的来源指引继续保留：出行前查看护盾缺口、功法条目显示来源、舆图只给已知地点添加小签。不提前暴露未见的随机容器；同一个地点有多门功法时合并显示。</p><h3>长文阅读</h3><p>行囊和功法列表都用分页，没有内部滚动条。只有这类罕见的长说明允许滚动。右侧以压在宣纸上的砚台作为滑块，支持拖动、方向键、Page Up / Page Down、Home / End；上下笔尖也可点击。正文仍可用滚轮阅读。</p><h3>草图说明</h3><p>本页面不读写游戏存档。人物数值、仓库数量与已领悟状态为展示布局的示例；品级、图标、字体与纸纹复用项目资源。具体玩法数值沿用游戏规则，不以此草图代替。</p></div><div class="inkscroll"><button id="up" aria-label="说明向上翻">▴</button><input id="inkrange" type="range" min="0" max="1000" value="0" aria-label="砚台滑块，滚动长说明" aria-orientation="vertical"><button id="down" aria-label="说明向下翻">▾</button></div></div><p class="hint">仅长说明滚动 · 砚台可拖动 / 键盘操作 · Esc 收起</p>`);const r=$('reader'),v=$('inkrange');const sync=()=>{v.value=Math.round(r.scrollTop/Math.max(1,r.scrollHeight-r.clientHeight)*1000);v.setAttribute('aria-valuetext',Math.round(v.value/10)+'%')};r.addEventListener('scroll',sync,{passive:true});v.addEventListener('input',()=>r.scrollTop=+v.value/1000*(r.scrollHeight-r.clientHeight));$('up').onclick=()=>r.scrollBy(0,-160);$('down').onclick=()=>r.scrollBy(0,160);v.addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp','PageDown','PageUp','Home','End'].includes(e.key)){e.preventDefault();r.scrollTop=e.key==='Home'?0:e.key==='End'?r.scrollHeight:r.scrollTop+({ArrowDown:36,ArrowUp:-36,PageDown:240,PageUp:-240}[e.key]||0);sync()}})}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.mode){state.mode=b.dataset.mode;render()}
 if(b.dataset.tab||b.dataset.jump){state.tab=b.dataset.tab||b.dataset.jump;state.sub=state.tab==='skill'?'spell':'all';state.page=0;render()}
 if(b.dataset.sub){state.sub=b.dataset.sub;state.page=0;render()}
 if(b.dataset.page!=null){state.page=+b.dataset.page;render()}
 if(b.dataset.count!=null){const p=pack[+b.dataset.count],delta=+b.dataset.delta,max=p.cat==='pre'?1:3,total=pack.filter(x=>x.id===p.id).reduce((s,x)=>s+x.n,0);if(delta>0&&total>=max)return say(`${p.name}各品级合计最多 ${max} 枚`);p.n=Math.max(0,Math.min(p.have,p.n+delta));render()}
 if(b.dataset.skill){state.selected=b.dataset.skill;render()}
 if(b.dataset.select){state.tab='skill';state.sub='spell';state.selected=b.dataset.select;state.page=Math.floor(Object.keys(SPELLS).indexOf(state.selected)/6);render()}
 if(b.dataset.gear){if(b.dataset.gear.includes('sword')){state.gear=b.dataset.gear;$('attack').textContent=b.dataset.gear==='sword_qingya'?'84':b.dataset.gear==='sword_zhuying'?'70':'76';render();say('已换上'+gears.find(g=>g[0]===state.gear)[1]+'（草图示意）')}else say('已选择该法器 · 草图仅演示法剑换装')}
 if(b.dataset.quest!=null){const i=+b.dataset.quest;if(state.quests.has(i))state.quests.delete(i);else if(state.quests.size<2)state.quests.add(i);else return say('最多选择两个委托');render()}
 if(b.dataset.note)say(b.dataset.note);
 if(b.id==='track'){state.map=!state.map;render();say(state.map?'来源将在已知舆图地点标出':'已收起来源舆图标记')}
 if(b.id==='equipSkill'){if(state.sub==='spell'){if(!known.has(state.selected))return;state.spells=state.spells.map(x=>x===state.selected?null:x);state.spells[2]=state.selected}else if(state.sub==='xinfa')state.xinfa=[state.xinfa[0],state.selected];else state.formation=state.selected;render();say('当前装配已更新（草图示意）')}
 if(b.id==='gap'){state.tab='skill';state.sub='spell';state.selected='zhishui';state.page=Math.floor(Object.keys(SPELLS).indexOf('zhishui')/6);render()}
 if(b.id==='ready')openModal('去仓库参悟',`<p>掌心雷 · 残页 4 / 4 · 已集齐</p><p style="margin:18px 0">实际游戏将返回洞府，打开仓库的「功法」分类。本草图只演示导航意图，不扣除物品与灵石。</p><button class="small-primary" data-note="草图：已指向洞府仓库 → 功法分类">前往仓库 ›</button>`);
 if(b.id==='long')longDescription();
 if(b.id==='attrs')openModal('内观 · 属性与来源',`<div class="attrgrid">${[['气血','428 · 境界 / 法衣'],['真气','186 · 境界 / 玉佩'],['攻击',$('attack').textContent+' · 境界 / 法剑'],['法力','44 · 境界'],['防御','36 · 法衣'],['神识','40 · 玉佩 / 灵台'],['会心','23% · 法剑 / 锋锐'],['闪身','2 次 · 境界']].map(([n,v])=>`<div><span>${n}</span><span class="dim">${v}</span></div>`).join('')}</div><p class="hint">示意来源以文字列出，不以图表占据整装主区。</p>`);
 if(b.id==='closeModal')closeModal();
 if(b.id==='back')say('草图：返回洞府，装配与行囊预案保留');
 if(b.id==='depart'){if(state.mode==='inner'){state.mode='prep';render();say('沿用同一份装配与行囊预案')}else say('草图：按当前品级与数量取用行囊，并启程；没有修改真实存档')}
 if(b.id==='dataToggle'){state.full=!state.full;state.page=0;b.textContent=state.full?'满仓库':'空仓库';render()}
});
document.addEventListener('change',e=>{if(e.target.id==='region'){state.region=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();if(!$('overlay').hidden)closeModal();else say('草图：回洞府')}if(e.key==='Tab'&&!$('overlay').hidden){const items=[...$('overlay').querySelectorAll('button,input,[tabindex="0"]')].filter(x=>!x.disabled),first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function fit(){const s=Math.min((innerWidth-24)/1280,(innerHeight-56)/720);$('frame').style.width=1280*s+'px';$('frame').style.height=720*s+'px';$('sheet').style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();render();
</script></body></html>
