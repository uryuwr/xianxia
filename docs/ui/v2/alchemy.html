<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>墨途 · 炼丹炉（v2）</title>
<link rel="stylesheet" href="kit/fonts.css">
<link rel="stylesheet" href="kit/strokes.css">
<link rel="stylesheet" href="kit/ink-ui.css">
<script src="kit/ink-ui.js"></script>
<style>
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
.abs { position: absolute; }
.head { left: 54px; top: 30px; display: flex; align-items: center; gap: 16px; }
.head .ink-title { font-size: 40px; }
/* 左：丹方竹简 */
.recipes { left: 40px; top: 104px; }
.recipes .ink-slip { height: 300px; }
.recipes .ink-slip small { display: inline; }
.recipes .note { margin-top: 14px; width: 330px; }
/* 中：丹炉 */
.stove { left: 452px; top: 92px; width: 380px; height: 420px; }
.stove .art { position: absolute; inset: 0; background: url(kit/art_danlu.svg) 0 0 / 100% 100% no-repeat; } /* 丹炉：与立绘同一套笔法生成（tools/portrait_gen.mjs） */
.mat { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.mat .ink-label { font-size: 13px; letter-spacing: .3em; }
.mat .ink-note { font-size: 11px; }
.mat .ok { color: var(--shilv); }
.fire { left: 470px; top: 548px; width: 344px; }
.fire .r { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--f-display); font-size: 17px; letter-spacing: .1em; margin-bottom: 6px; }
.fire .r small { font-family: var(--f-ui); font-size: 11px; color: var(--ink-dan); letter-spacing: 0; }
.fire .track { position: relative; }
.fire .zone { position: absolute; top: -6px; bottom: -6px; left: 58%; width: 15%; background: var(--zhu-wash); border-radius: 40% 50% 45% 50%; }
.fire .zone::before, .fire .zone::after { content: ""; position: absolute; top: 2px; bottom: 2px; width: 2px; background: var(--zhu); opacity: .5; }
.fire .zone::before { left: 0; } .fire .zone::after { right: 0; }
.fire .needle { position: absolute; top: -12px; left: 64%; width: 12px; height: 40px; margin-left: -6px; }
.fire .needle::before { content: ""; position: absolute; left: 5px; top: 8px; width: 2px; height: 28px; background: var(--ink); }
.fire .needle::after { content: ""; position: absolute; left: 0; top: 0; width: 12px; height: 12px; background: var(--zhu); -webkit-mask: var(--ink-splash-1) center / 170% 170%; mask: var(--ink-splash-1) center / 170% 170%; }
.fire .ends { display: flex; justify-content: space-between; font-family: var(--f-kai); font-size: 13px; color: var(--ink-dan); margin-top: 8px; }
/* 右：丹方详情 */
.detail { left: 880px; top: 70px; width: 320px; padding: 26px 30px; }
.detail .name { display: flex; align-items: center; gap: 12px; font-family: var(--f-display); font-size: 32px; letter-spacing: .12em; }
.detail .grade { font-family: var(--f-kai); font-size: 14px; color: var(--q-ling); margin: 4px 0 12px; }
.detail .desc { font-size: 15px; line-height: 1.8; color: var(--ink-nong); margin: 0 0 8px; }
.detail .ink-row { font-size: 14px; padding: 6px 2px; }
.detail .ink-row .v { font-family: var(--f-kai); font-size: 15px; }
.detail .rate { display: flex; align-items: center; gap: 16px; margin-top: 12px; }
.detail .rate .ink-ring { width: 74px; height: 74px; }
.detail .rate .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--f-display); font-size: 22px; color: var(--ink); }
.detail .rate p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--ink-zhong); }
.go { right: 66px; bottom: 44px; display: flex; align-items: center; gap: 22px; }
</style>
</head>
<body class="ink-stage">
  <div class="abs head"><span class="ink-title">炼丹炉</span><div class="ink-rule" style="width:140px"></div><span class="ink-seal two" style="--s:30px">二阶</span></div>

  <div class="abs recipes">
    <div class="ink-slips">
      <div class="ink-slip on">聚气丹<small>　可炼 ×2</small></div>
      <div class="ink-slip">回春丹<small>　可炼 ×6</small></div>
      <div class="ink-slip">回气丹<small>　可炼 ×4</small></div>
      <div class="ink-slip">驱毒丹<small>　缺紫藤</small></div>
      <div class="ink-slip dim">破障丹<small>　缺赤炎果</small></div>
      <div class="ink-slip dim">筑基丹<small>　丹炉三阶</small></div>
    </div>
    <div class="note ink-note">丹方得自出行所获残页 · 卷宗中可查来历</div>
  </div>

  <!-- 丹炉：写意 SVG 插画 + 一方朱印 -->
  <div class="abs stove">
    <div class="art"></div>
    <span class="ink-seal" style="position:absolute;left:173px;top:252px;--s:34px">丹</span>
    <div class="mat" style="left:-6px;top:40px"><span class="ink-slot q-ling"><b>露</b><em>3/3</em></span><span class="ink-label">主药</span><span class="ink-note ok">寒露草</span></div>
    <div class="mat" style="left:158px;top:-16px"><span class="ink-slot q-fan"><b>泉</b><em>1/1</em></span><span class="ink-label">药引</span><span class="ink-note ok">灵泉水</span></div>
    <div class="mat" style="right:-6px;top:40px"><span class="ink-slot q-ling"><b>丹</b><em>1/1</em></span><span class="ink-label">辅药</span><span class="ink-note ok">狼妖内丹</span></div>
  </div>

  <div class="abs fire">
    <div class="r">火候<small>按住 空格 添火 · 松开 退火</small></div>
    <div class="track"><div class="ink-bar thick" style="--v:.64;--bc:linear-gradient(90deg,#d9b45e,#b8291a)"><i></i></div><span class="zone"></span><span class="needle"></span></div>
    <div class="ends"><span>文火</span><span>武火</span></div>
  </div>

  <section class="abs detail ink-paper alt">
    <div class="name">聚气丹<span class="ink-seal green" style="--s:26px;font-size:13px">灵</span></div>
    <div class="grade">灵品 · 一炉二枚</div>
    <p class="desc">服之修为 +60；十息之内真气回复加倍。出行前服下，可抵一场恶战。</p>
    <div class="ink-list">
      <div class="ink-row"><span class="k">寒露草</span><span class="v">3 / 3 <span class="c-ling">足</span></span></div>
      <div class="ink-row"><span class="k">狼妖内丹</span><span class="v">1 / 2 <span class="c-ling">足</span></span></div>
      <div class="ink-row"><span class="k">灵泉水</span><span class="v">1 / 1 <span class="c-ling">足</span></span></div>
      <div class="ink-row"><span class="k">炉火</span><span class="v">灵石 20</span></div>
    </div>
    <div class="rate">
      <div class="ink-ring" style="--v:.82;--rc:var(--shilv)"><span class="pct">82<small style="font-size:12px">%</small></span></div>
      <p>成丹之数。火候落在<span class="ink-zhu">朱色区间</span>内<br>可得上品，偏离则或成废丹。</p>
    </div>
  </section>

  <div class="abs go">
    <span class="ink-btn">回洞府 <span class="key">Esc</span></span>
    <button class="ink-seal-btn">开炉</button>
  </div>
</body>
</html>
