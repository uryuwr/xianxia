<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>墨途 · 程序脸谱试验 v1（纯 SVG）</title>
<style>
body { margin: 0; background: #2a2925; color: #ece6d6; font: 14px/1.7 "Microsoft YaHei", sans-serif; padding: 18px 26px; }
h1 { font: 400 28px KaiTi, STKaiti, serif; margin: 0 0 4px; letter-spacing: .08em; }
.bar { margin: 6px 0 12px; }
button { font: 15px KaiTi, serif; background: #3b3a35; color: #ece6d6; border: 1px solid #6d6a60; padding: 4px 12px; margin: 0 6px 6px 0; cursor: pointer; border-radius: 3px; }
button.on { background: #b8291a; border-color: #b8291a; }
#grid { display: grid; grid-template-columns: repeat(4, 300px); gap: 14px; }
.card { background: #efe7d5; color: #2a2724; border-radius: 3px 6px 4px 5px; padding: 6px 8px 8px; }
.card b { font: 400 20px KaiTi, serif; } .card small { color: #6b665c; display: block; line-height: 1.4; min-height: 2.8em; }
.tiny { display: flex; gap: 18px; align-items: flex-end; background: #e9e0cb; padding: 10px 14px; border-radius: 3px; margin-top: 14px; color: #2a2724; }
.tiny div { text-align: center; font-size: 12px; }
small.note { color: #a8a293; }
</style></head>
<body>
<h1>程序脸谱 · 试验 v1</h1>
<small class="note">纯代码生成的对称纹样（无图片）。每张脸谱 = 底色 + 眉 + 眼窝 + 额纹 + 鼻窝 + 嘴叉 + 腮纹的参数组合；新角色只需换一组参数。</small>
<div class="bar"><button data-p="ink" class="on">水墨色板（推荐）</button><button data-p="opera">京剧原色</button><button id="rnd">随机生成一组新角色</button></div>
<div id="grid"></div>
<div class="tiny" id="tiny"></div>
<script>
const NS = "http://www.w3.org/2000/svg";
const PAL = {
  ink:   { red: "#b8291a", black: "#1d1c1b", white: "#f1ece0", blue: "#2f6f8f", green: "#4f7d63", gold: "#b08a3e", silver: "#b9bcb8", purple: "#6b4a5a", skin: "#e9d3b8", line: "#1d1c1b" },
  opera: { red: "#d8231c", black: "#0c0c0c", white: "#fbfbf8", blue: "#1f55c8", green: "#1f9a4a", gold: "#e3b21b", silver: "#c9ccd0", purple: "#7a2c86", skin: "#f0d5bd", line: "#0c0c0c" },
};
// 角色：底色、主纹色、各部件样式
const CAST = [
  { n: "林墨 · 素面（外来者）", d: "画中人都有脸谱，唯他素面；随修行渐显", base: "skin", main: "black", brow: "sword", eye: "none", fore: "none", nose: "none", mouth: "none", cheek: "none", acc: "red" },
  { n: "林墨 · 剑势道途", d: "朱为忠勇；剑纹自眉心上冲", base: "white", main: "red", brow: "sword", eye: "drop", fore: "sword", nose: "dot", mouth: "plain", cheek: "none", acc: "black" },
  { n: "林墨 · 五行道途", d: "石青为桀骜；额上五行环", base: "white", main: "blue", brow: "cloud", eye: "fan", fore: "ring", nose: "dot", mouth: "plain", cheek: "swirl", acc: "black" },
  { n: "心魔 · 林墨倒影", d: "黑白反转的剑势脸谱", base: "black", main: "white", brow: "sword", eye: "drop", fore: "sword", nose: "dot", mouth: "plain", cheek: "none", acc: "red" },
  { n: "玄机子 · 引路仙师", d: "泥金为神仙；额有太极", base: "gold", main: "black", brow: "long", eye: "fan", fore: "taiji", nose: "bat", mouth: "beard", cheek: "none", acc: "red" },
  { n: "狼妖头目（人形）", d: "绿为草莽；獠牙嘴叉", base: "green", main: "black", brow: "flame", eye: "fang", fore: "flame", nose: "bat", mouth: "fang", cheek: "swirl", acc: "white" },
  { n: "奸商 · 宝阁掌柜", d: "白为奸诈；小丑豆腐块", base: "white", main: "black", brow: "thin", eye: "slit", fore: "none", nose: "tofu", mouth: "thin", cheek: "none", acc: "red" },
  { n: "剑修遗府 · 残魂", d: "银为鬼魅；裂纹", base: "silver", main: "purple", brow: "flame", eye: "hollow", fore: "crack", nose: "dot", mouth: "plain", cheek: "crack", acc: "black" },
];
let pal = "ink";

const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
const sym = (g, d, fill, extra = {}) => { el("path", { d, fill, ...extra }, g); el("path", { d, fill, transform: "translate(200 0) scale(-1 1)", ...extra }, g); };

function mask(c, size = 280) {
  const P = PAL[pal], col = (k) => P[k];
  const svg = el("svg", { viewBox: "0 0 200 240", width: size, height: size * 1.2 });
  const defs = el("defs", {}, svg);
  const f = el("filter", { id: "b" + Math.random().toString(36).slice(2), x: "-5%", y: "-5%", width: "110%", height: "110%" }, defs);
  el("feTurbulence", { type: "fractalNoise", baseFrequency: "0.08", numOctaves: "2", seed: "4", result: "t" }, f);
  el("feDisplacementMap", { in: "SourceGraphic", in2: "t", scale: pal === "ink" ? "2.2" : "0.6", xChannelSelector: "R", yChannelSelector: "G" }, f);
  const fid = "url(#" + f.id + ")";
  const face = "M100 18 C150 18 178 58 178 108 C178 168 150 218 100 226 C50 218 22 168 22 108 C22 58 50 18 100 18 Z";
  const clip = el("clipPath", { id: "c" + f.id }, defs); el("path", { d: face }, clip);
  // 头发 / 盔头示意
  el("path", { d: "M18 112 C10 40 60 4 100 4 C140 4 190 40 182 112 C176 70 150 34 100 30 C50 34 24 70 18 112 Z", fill: P.black }, svg);
  const g = el("g", { "clip-path": "url(#c" + f.id + ")", filter: fid }, svg);
  el("path", { d: face, fill: col(c.base) }, g);
  const M = col(c.main), A = col(c.acc);
  // 额纹
  if (c.fore === "sword") el("path", { d: "M100 26 L108 70 L100 96 L92 70 Z", fill: M }, g);
  if (c.fore === "ring") { el("circle", { cx: 100, cy: 58, r: 15, fill: "none", stroke: M, "stroke-width": 5 }, g); el("circle", { cx: 100, cy: 58, r: 4, fill: A }, g); }
  if (c.fore === "taiji") { el("circle", { cx: 100, cy: 56, r: 14, fill: P.white }, g); el("path", { d: "M100 42 A14 14 0 0 1 100 70 A7 7 0 0 1 100 56 A7 7 0 0 0 100 42 Z", fill: P.black }, g); }
  if (c.fore === "flame") el("path", { d: "M100 22 C112 40 98 50 112 66 C104 64 102 76 100 92 C98 76 96 64 88 66 C102 50 88 40 100 22 Z", fill: M }, g);
  if (c.fore === "crack") el("path", { d: "M96 20 L104 46 L94 62 L106 84 L100 98", fill: "none", stroke: M, "stroke-width": 3 }, g);
  // 腮纹
  if (c.cheek === "swirl") sym(g, "M44 150 C40 130 58 120 70 132 C78 140 70 154 60 148 C54 144 58 136 64 138", "none", { stroke: M, "stroke-width": 4, "stroke-linecap": "round" });
  if (c.cheek === "crack") sym(g, "M30 120 L46 136 L38 150 L54 168", "none", { stroke: M, "stroke-width": 2.6 });
  // 眼窝
  if (c.eye === "drop") sym(g, "M58 104 C66 90 86 88 92 100 C90 120 74 138 62 150 C56 134 52 118 58 104 Z", M);
  if (c.eye === "fan") sym(g, "M30 96 C50 84 80 86 94 98 C88 112 70 122 44 124 C34 116 30 106 30 96 Z", M);
  if (c.eye === "fang") sym(g, "M34 92 C56 86 82 90 94 100 L84 116 C70 112 54 120 40 136 C34 120 32 104 34 92 Z", M);
  if (c.eye === "slit") sym(g, "M58 106 C70 100 82 100 90 106 C82 110 70 110 58 106 Z", M);
  if (c.eye === "hollow") sym(g, "M54 100 C64 88 86 90 90 104 C88 120 70 126 58 120 C50 114 50 106 54 100 Z", M);
  // 眼（留白眼 + 墨瞳）
  if (c.eye !== "none") sym(g, "M64 106 C70 100 82 100 88 106 C82 111 70 111 64 106 Z", c.base === "black" ? P.white : P.white);
  sym(g, "M73 106 a3.6 3.6 0 1 0 7.2 0 a3.6 3.6 0 1 0 -7.2 0 Z", c.eye === "hollow" ? M : P.black);
  // 眉
  if (c.brow === "sword") sym(g, "M94 92 C84 82 62 76 40 80 C58 82 76 86 92 98 Z", c.base === "black" ? P.white : P.black);
  if (c.brow === "cloud") sym(g, "M94 92 C86 74 60 70 44 80 C52 76 62 80 60 88 C70 82 84 86 92 98 Z", P.black);
  if (c.brow === "long") sym(g, "M94 90 C80 80 56 78 34 94 C30 110 28 130 34 150 C34 124 42 100 92 96 Z", P.white);
  if (c.brow === "flame") sym(g, "M94 94 C88 70 70 60 56 70 C62 72 62 80 54 82 C46 76 38 82 38 90 C56 86 76 88 92 100 Z", M);
  if (c.brow === "thin") sym(g, "M90 92 C80 88 66 88 56 92 C66 90 80 92 90 96 Z", P.black);
  // 鼻窝
  if (c.nose === "dot") el("path", { d: "M92 150 C96 144 104 144 108 150 C104 154 96 154 92 150 Z", fill: M }, g);
  if (c.nose === "bat") el("path", { d: "M80 148 C88 138 96 146 100 140 C104 146 112 138 120 148 C112 156 104 150 100 158 C96 150 88 156 80 148 Z", fill: M }, g);
  if (c.nose === "tofu") el("rect", { x: 74, y: 96, width: 52, height: 56, rx: 6, fill: P.white, stroke: P.black, "stroke-width": 2 }, g);
  // 嘴
  if (c.mouth === "plain") el("path", { d: "M84 178 C94 174 106 174 116 178 C106 184 94 184 84 178 Z", fill: A }, g);
  if (c.mouth === "thin") el("path", { d: "M86 178 C96 176 104 176 114 178", fill: "none", stroke: P.black, "stroke-width": 2 }, g);
  if (c.mouth === "beard") { el("path", { d: "M84 176 C94 172 106 172 116 176 C106 181 94 181 84 176 Z", fill: A }, g); for (let i = -3; i <= 3; i++) el("path", { d: `M${100 + i * 8} 184 C${100 + i * 10} 206 ${100 + i * 9} 222 ${100 + i * 7} 240`, fill: "none", stroke: P.white, "stroke-width": 3, opacity: 0.9 }, g); }
  if (c.mouth === "fang") { el("path", { d: "M70 172 C86 186 114 186 130 172 C118 196 82 196 70 172 Z", fill: P.black }, g); sym(g, "M80 178 L86 196 L90 180 Z", P.white); }
  // 素面：只有淡淡的眉眼，和其他人区别
  if (c.eye === "none") { sym(g, "M64 106 C70 102 82 102 88 106", "none", { stroke: P.black, "stroke-width": 2 }); el("path", { d: "M90 178 C96 176 104 176 110 178", fill: "none", stroke: P.red, "stroke-width": 2, opacity: 0.7 }, g); }
  // 轮廓与发带
  el("path", { d: face, fill: "none", stroke: P.line, "stroke-width": 2.6, filter: fid }, svg);
  el("path", { d: "M30 54 C70 40 130 40 170 54 L168 62 C130 50 70 50 32 62 Z", fill: P.red }, svg);
  return svg;
}

function render() {
  const grid = document.getElementById("grid"); grid.innerHTML = "";
  for (const c of CAST) {
    const card = document.createElement("div"); card.className = "card";
    card.appendChild(mask(c));
    card.insertAdjacentHTML("beforeend", `<b>${c.n}</b><small>${c.d}</small>`);
    grid.appendChild(card);
  }
  const t = document.getElementById("tiny");
  t.innerHTML = "<div style='align-self:center;font:16px KaiTi'>游戏 45° 镜头下的大小（约 16–24 像素）：</div>";
  for (const c of CAST) { const d = document.createElement("div"); d.appendChild(mask(c, 20)); d.insertAdjacentHTML("beforeend", "<br>" + c.n.split(" · ")[0]); t.appendChild(d); }
}
document.querySelectorAll("button[data-p]").forEach((b) => (b.onclick = () => { pal = b.dataset.p; document.querySelectorAll("button[data-p]").forEach((x) => x.classList.toggle("on", x === b)); render(); }));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
document.getElementById("rnd").onclick = () => {
  const bases = ["red", "black", "white", "blue", "green", "gold", "silver", "purple"];
  for (let i = 4; i < CAST.length; i++) {
    const base = pick(bases); let main = pick(bases.filter((x) => x !== base));
    Object.assign(CAST[i], { n: "随机角色 " + (i - 3), d: "随机参数组合", base, main, acc: pick(["red", "black", "white"]), brow: pick(["sword", "cloud", "long", "flame", "thin"]), eye: pick(["drop", "fan", "fang", "slit", "hollow"]), fore: pick(["none", "sword", "ring", "taiji", "flame", "crack"]), nose: pick(["dot", "bat", "tofu"]), mouth: pick(["plain", "thin", "beard", "fang"]), cheek: pick(["none", "swirl", "crack"]) });
  }
  render();
};
render();
</script>
</body></html>
